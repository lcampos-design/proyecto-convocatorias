<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Centro de Control — Movistar Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#111827;font-size:14px;min-height:100vh;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
/* La barra de arriba */
.bar{background:#0f1117;color:#fff;position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 11px) 16px 11px;display:flex;align-items:center;gap:12px}
.bar-logo{width:30px;height:30px;filter:brightness(0) invert(1);flex-shrink:0}
.bar-txt{flex:1;min-width:0}
.bar-t{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-s{font-size:11px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-btn{background:none;border:1px solid #374151;color:#d1d5db;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;flex-shrink:0}
.atras{background:none;border:none;color:#d1d5db;font-size:20px;cursor:pointer;padding:2px 4px;flex-shrink:0}
.wrap{max-width:1240px;margin:0 auto;padding:14px}
.pantalla{display:none}.pantalla.on{display:block}
/* Ingreso */
.login{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:26px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.login-t{font-size:18px;font-weight:700;text-align:center}
.login-s{font-size:12px;color:#6b7280;text-align:center;margin:4px 0 20px}
.lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:5px}
.in{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;outline:none;margin-bottom:14px;background:#fff}
.in:focus{border-color:#0f1117}
.btn-ok{width:100%;padding:13px;background:#0f1117;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer}
.err{display:none;background:#ffe9ee;color:#9f1239;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
/* Los shows */
.grupo{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#6b7280;margin:18px 2px 8px}
.show{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:13px 15px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.show:active{transform:scale(.995)}
.show-main{flex:1;min-width:0}
.show-n{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.show-f{font-size:12px;color:#6b7280;margin-top:2px}
.show-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.vivo-pill{font-size:10px;font-weight:700;letter-spacing:.5px;color:#fff;background:#9f1239;border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:5px}
.vivo-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:incLatido 1.4s infinite}
.flecha{color:#c4c8cf;font-size:18px}
.vacio{text-align:center;padding:40px 18px;color:#6b7280;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
/* El tablero */
.tab-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.tab-grid>*{min-width:0}
@media(min-width:960px){.tab-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.panel{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:12px}
.fila{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inc-resumen{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.inc-cuenta{font-size:12px;padding:5px 10px;border-radius:999px;background:#f1f1f4;color:#5b5b66}
.inc-cuenta strong{font-size:14px;margin-right:3px}
.chip{font-size:12px;font-weight:600;background:#fff;border:1.5px solid #d1d5db;color:#4b5563;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip.on{background:#0f1117;border-color:#0f1117;color:#fff}
.sep{width:1px;height:20px;background:#e5e7eb;margin:0 2px}
.inc-lugares{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.inc-lugar{font-size:12px;font-weight:600;background:#fff;border:1.5px solid #d1d5db;color:#374151;border-radius:8px;padding:7px 10px;cursor:pointer}
.inc-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-left:4px solid #d1d5db;border-radius:11px;padding:11px 13px;margin-bottom:8px}
.inc-card.resuelta{opacity:.72}
.inc-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inc-tipo{font-size:14px;font-weight:600;flex:1;min-width:0}
.inc-hora{font-size:12px;color:#6b7280;font-variant-numeric:tabular-nums}
.inc-donde{font-size:12px;color:#6b7280;margin-top:3px}
.inc-acc{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:5px;font-size:12px;color:#15803d}
.inc-nota{font-size:13px;color:#374151;margin-top:5px;white-space:pre-wrap}
.inc-res{font-size:12.5px;color:#374151;margin-top:7px;background:#f6f6f8;border-radius:8px;padding:6px 9px}
.inc-vivo{font-size:11px;color:#15803d;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.inc-vivo::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;animation:incLatido 1.6s infinite}
.inc-vivo.mal{color:#9f1239}
@keyframes incLatido{0%,100%{opacity:1}50%{opacity:.25}}
.inc-card.nueva{animation:incLlega 1.6s ease-out}
@keyframes incLlega{0%{transform:translateY(-10px);opacity:0}25%{transform:none;opacity:1;background:#fff3bf}100%{background:#fff}}
.inc-cuenta.pulso{animation:incPulso 1.3s ease-in-out infinite}
@keyframes incPulso{0%,100%{box-shadow:0 0 0 0 rgba(159,18,57,.45)}50%{box-shadow:0 0 0 6px rgba(159,18,57,0)}}
.acciones-top{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-bottom:10px}
.btn-s{font-size:12px;font-weight:600;background:#fff;border:1px solid #d1d5db;color:#111827;border-radius:8px;padding:6px 11px;cursor:pointer}
.pie{text-align:center;font-size:11px;color:#9ca3af;padding:20px 10px 30px}
@media(max-width:520px){.wrap{padding:10px}.panel{padding:8px}}
</style>
</head>
<body>

<div class="bar">
  <button class="atras" id="btnAtras" onclick="volverShows()" style="display:none" aria-label="Volver">←</button>
  <img class="bar-logo" src="logo-sbs.png" alt="SBS">
  <div class="bar-txt">
    <div class="bar-t" id="barT">Centro de Control</div>
    <div class="bar-s" id="barS">Movistar Arena · Incidencias en vivo</div>
  </div>
  <button class="bar-btn" id="btnSalir" onclick="salir()" style="display:none">Salir</button>
</div>

<!-- Ingreso -->
<div class="pantalla on" id="pLogin">
  <div class="login">
    <div class="login-card">
      <div class="login-t">Centro de Control</div>
      <div class="login-s">Movistar Arena · Show Business Solutions</div>
      <label class="lbl">Email</label>
      <input class="in" type="email" id="lgEmail" autocomplete="username" placeholder="tu@email.com" onkeydown="if(event.key==='Enter')ingresar()">
      <label class="lbl">Contraseña</label>
      <input class="in" type="password" id="lgPass" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')ingresar()">
      <div class="err" id="lgErr"></div>
      <button class="btn-ok" id="lgBtn" onclick="ingresar()">Ingresar</button>
    </div>
  </div>
</div>

<!-- Los shows del Arena -->
<div class="pantalla" id="pShows">
  <div class="wrap" id="showsBody"><div class="vacio">Cargando…</div></div>
</div>

<!-- El tablero de un show -->
<div class="pantalla" id="pShow">
  <div class="wrap">
    <div class="acciones-top">
      <span class="inc-vivo" id="vivo">En vivo</span>
      <button class="btn-s" onclick="cargarIncidencias()" title="Actualizar ahora">↻</button>
      <button class="btn-s" onclick="informe()" title="El informe del show para guardar o imprimir">↓ Informe PDF</button>
    </div>
    <div class="inc-resumen" id="resumen"></div>
    <div class="tab-grid">
      <div class="panel">
        <div class="fila" id="vistas" style="margin-bottom:8px"></div>
        <div id="plano"></div>
        <div class="inc-lugares" id="lugares"></div>
      </div>
      <div>
        <div class="fila" id="filtros" style="margin-bottom:10px"></div>
        <div id="lista"></div>
      </div>
    </div>
    <div class="grupo" style="margin-top:22px">Métricas del show</div>
    <div id="metricas"></div>
  </div>
</div>

<div class="pie">Show Business Solutions · Centro de Control</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://nkmmifyzliiimmtlzeqo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rbW1pZnl6bGlpaW1tdGx6ZXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMjM0MTAsImV4cCI6MjA5NjY5OTQxMH0.QU5JBRH_rbTzUu12oeWmCDmJv6B3UUVKPA5HyeuuzSg';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ── INCIDENCIAS: catálogo, semáforo y plano ─────────────────────
// Este bloque es idéntico en admin.html y supervisor-mobile.html (una prueba
// lo vigila): lo que carga el supervisor en la tablet y lo que ve el panel
// tienen que hablar el mismo idioma. Sin datos del público: sólo qué pasó,
// dónde y qué se hizo.
const INC_NIVELES = {

// Cada categoría: sus tipos (con el nivel que traen por defecto) y el

const INC_CATALOGO = [

  { cat: 'Personal', tipos: [['Falta personal en el sector', 2], ['Personal descompuesto', 2], ['Problema de conducta o uniforme', 1]],

  { cat: 'Otro', tipos: [['Otra incidencia', 1]],
    acciones: ['Se avisó a coordinación', 'Se resolvió en el lugar'] }
];
function incCategoria(cat) { return INC_CATALOGO.find(c => c.cat === cat) || INC_CATALOGO[INC_CATALOGO.length - 1]; }
function incNivelDe(cat, tipo) { const t = incCategoria(cat).tipos.find(x => x[0] === tipo); return t ? t[1] : 1; }
// Lugares que no están en el plano.
const INC_LUGARES = ['Accesos y puertas', 'Pasillos y escaleras', 'Baños', 'Barras y gastronomía', 'Backstage', 'Exterior / filas de ingreso', 'Otro lugar'];
// Las incidencias son sólo de los shows del Movistar Arena.
function incEsArena(area) { return /arena|movistar/i.test(String(area || '')); }
function incEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function incHora(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
// El día (AAAA-MM-DD, hora de acá): una convocatoria del Arena puede tener
// muchas fechas, y cada fecha es un show.
function incDia(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// "21:34" si es de hoy; "24/10 21:34" si es de otro día.
function incCuando(iso) {
  const dia = incDia(iso); if (!dia) return '';
  return (dia === incDia(new Date().toISOString()) ? '' : dia.slice(8, 10) + '/' + dia.slice(5, 7) + ' ') + incHora(iso);
}
function incNivelChip(n) {
  const v = INC_NIVELES[n] || INC_NIVELES[1];
  return '<span style="display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:' + v.fondo + ';color:' + v.color + '"><span style="width:7px;height:7px;border-radius:50%;background:' + v.color + '"></span>' + v.nombre + '</span>';
}
// Primero las abiertas, de la más grave a la más leve; dentro, las más nuevas
// arriba. Después las resueltas, también de la más nueva a la más vieja.
function incOrdenar(lista) {
  return (lista || []).slice().sort((a, b) => {
    const ra = a.estado === 'resuelta' ? 1 : 0, rb = b.estado === 'resuelta' ? 1 : 0;
    if (ra !== rb) return ra - rb;
    if (!ra && (b.nivel || 1) !== (a.nivel || 1)) return (b.nivel || 1) - (a.nivel || 1);
    return String(b.created_at || '').localeCompare(String(a.created_at || ''));
  });
}
// Lo abierto en cada sector: cuántas hay y cuál es la más grave.
function incResumenSectores(lista) {
  const niveles = {}, cuentas = {};
  (lista || []).filter(i => i.estado !== 'resuelta').forEach(i => {
    cuentas[i.sector] = (cuentas[i.sector] || 0) + 1;
    niveles[i.sector] = Math.max(niveles[i.sector] || 0, i.nivel || 1);
  });
  return { niveles, cuentas };
}

// El plano del Movistar Arena por sectores, visto desde arriba con el
// escenario arriba. El campo se arma de dos maneras: de pie (delantero y

const INC_PLANO_TRIBUNAS = [

  { id: 'Platea 113', txt: '113', t: 'baja', p: '320,176 280,176 274,204 274,246 296,246 320,208', lx: 298, ly: 212 },

  // Platea alta, izquierda
  { id: 'Platea 301', txt: '301', t: 'alta', r: [56, 30, 36, 32] },
  { id: 'Platea 302', txt: '302', t: 'alta', r: [56, 66, 36, 22] },

  // Platea alta, fondo

  { id: 'Platea 312', txt: '312', t: 'alta', p: '364,210 328,210 304,252 304,284 334,284 364,248', lx: 334, ly: 252 },

  { id: 'Platea 314', txt: '314', t: 'alta', r: [328, 144, 36, 20] },

  { id: 'Platea 317', txt: '317', t: 'alta', r: [328, 30, 36, 32] }
];
const INC_PLANO_CAMPO = {
  campos: [
    { id: 'Campo delantero', txt: 'CAMPO DELANTERO', t: 'campo', r: [150, 36, 120, 78] },
    { id: 'Campo trasero',   txt: 'CAMPO TRASERO',   t: 'campo', r: [150, 118, 120, 82] }
  ],
  // Con asientos: A–D junto al escenario, F–J en el medio, K–N al fondo.
  asientos: [['A', 'B', 'C', 'D'], ['F', 'G', 'H', 'J'], ['K', 'L', 'M', 'N']].flatMap((fila, i) =>
    fila.map((l, j) => ({ id: 'Campo ' + l, txt: l, t: 'campo', r: [150 + j * 31, 36 + i * 56, 27, 52] })))
};
function incSectoresPlano(armado) { return INC_PLANO_TRIBUNAS.concat(INC_PLANO_CAMPO[armado] || INC_PLANO_CAMPO.campos); }
// Si ya hay incidencias en "Campo A".."Campo N", el show es con asientos.
function incArmadoDe(lista) { return (lista || []).some(i => /^Campo [A-N]$/.test(i.sector || '')) ? 'asientos' : 'campos'; }
// El plano en SVG. op: { armado, niveles, cuentas, sel, onclick }. Cada
// sector se pinta con el color de su incidencia abierta más grave y muestra
// cuántas tiene abiertas.
function incPlanoSVG(op) {
  op = op || {};
  const niveles = op.niveles || {}, cuentas = op.cuentas || {};
  const BASE = { baja: '#d6e6f8', alta: '#eaf3fc', campo: '#c3d9f2' };
  const partes = incSectoresPlano(op.armado).map(s => {

}
// ── fin INCIDENCIAS compartido ──

// ── Centro de Control: lo que ve la gerencia del Movistar Arena ──
// Sólo lectura. Todo sale de dos funciones de la base (ger_convocatorias y
// ger_incidencias), que no devuelven nada a quien no es gerencia o admin.
let shows = [], showId = null, lista = [], filtro = 'abiertas', sectorSel = '', dia = null, armadoSel = '', timer = null;
let vistos = null, nuevos = new Set();
const hoyISO = () => incDia(new Date().toISOString());
function pantalla(id) {
  document.querySelectorAll('.pantalla').forEach(p => p.classList.toggle('on', p.id === id));
  document.getElementById('btnAtras').style.display = id === 'pShow' ? '' : 'none';
  document.getElementById('btnSalir').style.display = id === 'pLogin' ? 'none' : '';
  window.scrollTo(0, 0);
}
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) entrar(); else pantalla('pLogin');
}
async function ingresar() {
  const err = document.getElementById('lgErr'), btn = document.getElementById('lgBtn');
  err.style.display = 'none'; btn.disabled = true; btn.textContent = 'Ingresando…';
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('lgEmail').value.trim(), password: document.getElementById('lgPass').value });
  btn.disabled = false; btn.textContent = 'Ingresar';
  if (error) { err.textContent = error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos' : error.message; err.style.display = 'block'; return; }
  entrar();
}
async function salir() { clearInterval(timer); await sb.auth.signOut(); location.reload(); }
async function entrar() {
  // Un supervisor que entra acá va a su app.
  const { data: rol } = await sb.rpc('mi_rol');
  if (rol === 'supervisor') { location.replace('/supervisor-mobile'); return; }
  pantalla('pShows');
  await cargarShows();
}
async function cargarShows() {
  const { data, error } = await sb.rpc('ger_convocatorias');
  const body = document.getElementById('showsBody');
  if (error || data === null) {
    body.innerHTML = '<div class="vacio">Tu usuario no tiene acceso al Centro de Control. Pedíselo a Show Business Solutions.</div>';
    return;
  }
  shows = data || [];
  renderShows();
  // Si hay un show hoy, entra directo: es lo que se quiere ver.
  const deHoy = shows.filter(s => fechasDe(s).includes(hoyISO()));
  if (deHoy.length === 1 && !showId) abrirShow(deHoy[0].id);
}
function fechasDe(s) { return String(s.fecha || '').split(',').map(f => f.trim()).filter(Boolean).sort(); }
function resumenFechas(s) {
  const fs = fechasDe(s); if (!fs.length) return 'Sin fechas';
  const dm = f => f.slice(8, 10) + '/' + f.slice(5, 7);
  return fs.length === 1 ? dm(fs[0]) + '/' + fs[0].slice(0, 4) : dm(fs[0]) + ' al ' + dm(fs[fs.length - 1]) + ' · ' + fs.length + ' fechas';
}
function chipsAbiertas(s) {
  const c = [3, 2, 1].filter(nv => s['abiertas_' + nv]).map(nv =>
    '<span class="inc-cuenta" style="background:' + INC_NIVELES[nv].fondo + ';color:' + INC_NIVELES[nv].color + '"><strong>' + s['abiertas_' + nv] + '</strong>' + INC_NIVELES[nv].nombre.toLowerCase() + '</span>').join('');
  return c || (s.total ? '<span class="inc-cuenta">Sin abiertas · ' + s.total + ' en total</span>' : '<span class="inc-cuenta">Sin incidencias</span>');
}
function renderShows() {
  const hoy = hoyISO();
  const grupos = { hoy: [], proximos: [], anteriores: [] };
  shows.forEach(s => { const fs = fechasDe(s); if (fs.includes(hoy)) grupos.hoy.push(s); else if (fs.length && fs[0] > hoy) grupos.proximos.push(s); else grupos.anteriores.push(s); });
  grupos.proximos.sort((a, b) => fechasDe(a)[0].localeCompare(fechasDe(b)[0]));
  grupos.anteriores.sort((a, b) => (fechasDe(b).slice(-1)[0] || '').localeCompare(fechasDe(a).slice(-1)[0] || ''));
  const tarjeta = (s, vivo) => '<div class="show" onclick="abrirShow(\'' + s.id + '\')"><div class="show-main"><div class="show-n">' + incEsc(s.nombre) + (vivo ? '<span class="vivo-pill">HOY</span>' : '') + '</div>'
    + '<div class="show-f">' + resumenFechas(s) + (s.venue ? ' · ' + incEsc(s.venue) : '') + '</div><div class="show-chips">' + chipsAbiertas(s) + '</div></div><span class="flecha">›</span></div>';
  const body = document.getElementById('showsBody');
  if (!shows.length) { body.innerHTML = '<div class="vacio">Todavía no hay shows del Movistar Arena para mostrar.</div>'; return; }
  body.innerHTML = (grupos.hoy.length ? '<div class="grupo">Hoy</div>' + grupos.hoy.map(s => tarjeta(s, true)).join('') : '')
    + (grupos.proximos.length ? '<div class="grupo">Próximos</div>' + grupos.proximos.map(s => tarjeta(s)).join('') : '')
    + (grupos.anteriores.length ? '<div class="grupo">Anteriores</div>' + grupos.anteriores.map(s => tarjeta(s)).join('') : '');
}
async function abrirShow(id) {
  const s = shows.find(x => x.id === id); if (!s) return;
  showId = id; lista = []; filtro = 'abiertas'; sectorSel = ''; dia = null; vistos = null; nuevos = new Set();
  try { armadoSel = localStorage.getItem('incArmado:' + id) || ''; } catch (_) { armadoSel = ''; }
  document.getElementById('barT').textContent = s.nombre;
  document.getElementById('barS').textContent = 'Centro de Control · ' + resumenFechas(s);
  pantalla('pShow');
  render();
  await cargarIncidencias();
  clearInterval(timer);
  // En vivo: cada 15 segundos, mientras se está mirando.
  timer = setInterval(() => { if (document.getElementById('pShow').classList.contains('on') && !document.hidden) cargarIncidencias(); }, 15000);
}
function volverShows() {
  clearInterval(timer); showId = null;
  document.getElementById('barT').textContent = 'Centro de Control';
  document.getElementById('barS').textContent = 'Movistar Arena · Incidencias en vivo';
  pantalla('pShows'); cargarShows();
}
async function cargarIncidencias() {
  const vivo = document.getElementById('vivo');
  const { data, error } = await sb.rpc('ger_incidencias', { p_conv_id: showId });
  if (error || data === null) { vivo.textContent = 'Sin conexión'; vivo.className = 'inc-vivo mal'; return; }
  vivo.textContent = 'En vivo · ' + incHora(new Date().toISOString()); vivo.className = 'inc-vivo';
  lista = data || [];
  nuevos = vistos ? new Set(lista.filter(i => !vistos.has(i.id)).map(i => i.id)) : new Set();
  vistos = new Set(lista.map(i => i.id));
  if (dia === null) dia = lista.some(i => incDia(i.created_at) === hoyISO()) ? hoyISO() : '';
  render();
}
function delDia() { return dia ? lista.filter(i => incDia(i.created_at) === dia) : lista; }
function elegirVista(v) { incGuardarVista(v); render(); }
function elegirArmado(a) { armadoSel = a; try { localStorage.setItem('incArmado:' + showId, a); } catch (_) {} render(); }
function tocarSector(sector) { sectorSel = sectorSel === sector ? '' : sector; render(); }
function filtrar(k, v) { if (k === 'estado') filtro = v; if (k === 'dia') dia = v; if (k === 'sector') sectorSel = v; render(); }
function render() {
  const delD = delDia();
  const armado = armadoSel || incArmadoDe(lista);
  const res = incResumenSectores(delD);
  const abiertas = delD.filter(i => i.estado !== 'resuelta');
  const n = nv => abiertas.filter(i => (i.nivel || 1) === nv).length;
  document.getElementById('resumen').innerHTML = '<span style="font-size:12px;color:#6b7280;margin-right:2px">Abiertas:</span>' + [3, 2, 1].map(nv =>
    '<span class="inc-cuenta' + (nv === 3 && n(3) ? ' pulso' : '') + '" style="background:' + INC_NIVELES[nv].fondo + ';color:' + INC_NIVELES[nv].color + '"><strong>' + n(nv) + '</strong>' + INC_NIVELES[nv].nombre.toLowerCase() + '</span>').join('')
    + '<span class="inc-cuenta"><strong>' + (delD.length - abiertas.length) + '</strong>resueltas</span><span class="inc-cuenta"><strong>' + delD.length + '</strong>en total</span>';
  const vista = incVistaPreferida();
  document.getElementById('vistas').innerHTML = [['3d', '3D'], ['2d', 'Plano']].map(([k, t]) => '<button class="chip' + (vista === k ? ' on' : '') + '" onclick="elegirVista(\'' + k + '\')">' + t + '</button>').join('')
    + '<span class="sep"></span>' + [['campos', 'Campo de pie'], ['asientos', 'Con asientos']].map(([k, t]) => '<button class="chip' + (armado === k ? ' on' : '') + '" onclick="elegirArmado(\'' + k + '\')">' + t + '</button>').join('');
  incMontarPlano(document.getElementById('plano'), { armado, niveles: res.niveles, cuentas: res.cuentas, sel: sectorSel, onclick: 'tocarSector', titulo: (shows.find(x => x.id === showId) || {}).nombre });
  const met = document.getElementById('metricas');
  if (met) incPintarMetricas(met, delD);
  document.getElementById('lugares').innerHTML = INC_LUGARES.map(l => {
    const nv = res.niveles[l], c = res.cuentas[l] || 0, sel = sectorSel === l;
    return '<button class="inc-lugar" style="' + (nv ? 'background:' + INC_NIVELES[nv].fondo + ';border-color:' + INC_NIVELES[nv].color + ';color:' + INC_NIVELES[nv].color + ';' : '') + (sel ? 'outline:2px solid #0f1117;' : '')
      + '" onclick="tocarSector(\'' + incEsc(l) + '\')">' + incEsc(l) + (c ? ' <strong>' + c + '</strong>' : '') + '</button>';
  }).join('');
  const dias = [...new Set(lista.map(i => incDia(i.created_at)).filter(Boolean))].sort().reverse();
  const chip = (k, v, t, on) => '<button class="chip' + (on ? ' on' : '') + '" onclick="filtrar(\'' + k + '\',\'' + v + '\')">' + t + '</button>';
  document.getElementById('filtros').innerHTML = [['abiertas', 'Abiertas'], ['resueltas', 'Resueltas'], ['todas', 'Todas']].map(([v, t]) => chip('estado', v, t, filtro === v)).join('')
    + (dias.length > 1 || (dias.length === 1 && dia !== dias[0]) ? '<span class="sep"></span>' + chip('dia', '', 'Todos los días', !dia) + dias.map(d => chip('dia', d, d.slice(8, 10) + '/' + d.slice(5, 7), dia === d)).join('') : '')
    + (sectorSel ? '<span class="chip on">' + incEsc(sectorSel) + ' <span onclick="event.stopPropagation();filtrar(\'sector\',\'\')" style="margin-left:4px">✕</span></span>' : '');
  const visibles = incOrdenar(delD).filter(i => filtro === 'todas' || (filtro === 'abiertas') === (i.estado !== 'resuelta')).filter(i => !sectorSel || i.sector === sectorSel);
  const cont = document.getElementById('lista');
  if (!visibles.length) {
    cont.innerHTML = '<div class="vacio">' + (!lista.length ? 'Sin incidencias en este show.' : filtro === 'abiertas' ? 'No hay incidencias abiertas' + (sectorSel ? ' en ' + incEsc(sectorSel) : '') + '.' : 'Nada por acá.') + '</div>';
  } else {
    cont.innerHTML = visibles.map(i => {
      const v = INC_NIVELES[i.nivel] || INC_NIVELES[1], resuelta = i.estado === 'resuelta';
      return '<div class="inc-card' + (resuelta ? ' resuelta' : '') + (nuevos.has(i.id) ? ' nueva' : '') + '" style="border-left-color:' + v.color + '">'
        + '<div class="inc-card-top">' + incNivelChip(i.nivel) + '<span class="inc-tipo">' + incEsc(i.tipo) + '</span><span class="inc-hora">' + incCuando(i.created_at) + '</span></div>'
        + '<div class="inc-donde">' + incEsc(i.sector) + (i.ubicacion ? ' · ' + incEsc(i.ubicacion) : '') + ' · ' + incEsc(i.categoria) + '</div>'
        + ((i.acciones || []).length ? '<div class="inc-acc">' + i.acciones.map(a => '<span>✓ ' + incEsc(a) + '</span>').join('') + '</div>' : '')
        + (i.nota ? '<div class="inc-nota">' + incEsc(i.nota) + '</div>' : '')
        + (resuelta ? '<div class="inc-res"><strong>Resuelta ' + incCuando(i.resuelta_at) + '</strong> · ' + incEsc(i.resolucion || '') + '</div>' : '')
        + '</div>';
    }).join('');
  }
  nuevos = new Set();
}
// El informe del show (del día elegido), listo para guardar como PDF o imprimir.
function informe() {
  const s = shows.find(x => x.id === showId); if (!s) return;
  const l = delDia().slice().sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
  const cuenta = clave => { const m = {}; l.forEach(i => { const k = clave(i) || '—'; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const tabla = (titulo, pares) => '<h3>' + titulo + '</h3><table class="r">' + pares.map(p => '<tr><td>' + incEsc(p[0]) + '</td><td class="n">' + p[1] + '</td></tr>').join('') + '</table>';
  const cuando = dia ? dia.slice(8, 10) + '/' + dia.slice(5, 7) + '/' + dia.slice(0, 4) : resumenFechas(s);
  const fh = iso => { const d = incDia(iso); return d ? d.slice(8, 10) + '/' + d.slice(5, 7) + ' ' + incHora(iso) : ''; };
  const abiertas = l.filter(i => i.estado !== 'resuelta').length;
  const html = '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe de incidencias · ' + incEsc(s.nombre) + '</title>'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"><style>'
    + 'body{font-family:Poppins,sans-serif;color:#111827;margin:28px;font-size:11px}h1{font-size:18px;margin:0}h2{font-size:12px;font-weight:400;color:#6b7280;margin:2px 0 18px}'
    + 'h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#374151;margin:16px 0 6px}.cab{display:flex;align-items:center;gap:12px;border-bottom:2px solid #111827;padding-bottom:10px;margin-bottom:14px}'
    + '.cab img{width:38px}.res{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e5e7eb;padding:5px 6px;text-align:left;vertical-align:top}'
    + 'th{background:#111827;color:#fff;font-weight:600}.n{text-align:right;font-weight:600}.niv{font-weight:600}@media print{body{margin:12mm}}</style></head><body>'
    + '<div class="cab"><img src="' + location.origin + '/logo-sbs.png" alt=""><div><h1>Informe de incidencias · ' + incEsc(s.nombre) + '</h1><h2>Movistar Arena · ' + cuando + ' · ' + l.length + ' incidencia' + (l.length === 1 ? '' : 's') + ' · ' + abiertas + ' abierta' + (abiertas === 1 ? '' : 's') + ' · generado ' + new Date().toLocaleString('es-AR') + '</h2></div></div>'
    + '<div class="res">' + tabla('Gravedad', [3, 2, 1].map(nv => [INC_NIVELES[nv].nombre, l.filter(i => (i.nivel || 1) === nv).length])) + tabla('Categoría', cuenta(i => i.categoria)) + tabla('Sector', cuenta(i => i.sector)) + '</div>'
    + '<h3>Línea de tiempo</h3><table><tr><th>Cuándo</th><th>Sector</th><th>Qué pasó</th><th>Gravedad</th><th>Qué se hizo</th><th>Cómo se resolvió</th></tr>'
    + l.map(i => '<tr><td>' + fh(i.created_at) + '</td><td>' + incEsc(i.sector) + (i.ubicacion ? '<br><span style="color:#6b7280">' + incEsc(i.ubicacion) + '</span>' : '') + '</td><td>' + incEsc(i.tipo) + '<br><span style="color:#6b7280">' + incEsc(i.categoria) + '</span>' + (i.nota ? '<br>' + incEsc(i.nota) : '') + '</td>'
      + '<td class="niv" style="color:' + (INC_NIVELES[i.nivel] || INC_NIVELES[1]).color + '">' + (INC_NIVELES[i.nivel] || INC_NIVELES[1]).nombre + '</td><td>' + (i.acciones || []).map(incEsc).join('<br>') + '</td>'
      + '<td>' + (i.estado === 'resuelta' ? fh(i.resuelta_at) + ' · ' + incEsc(i.resolucion || '') : '<strong>Abierta</strong>') + '</td></tr>').join('')
    + '</table><script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>';
  const w = window.open('', '_blank');
  if (!w) { alert('El navegador bloqueó la ventana del informe. Permití las ventanas emergentes para este sitio.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}
iniciar();
</script>
