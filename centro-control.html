<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1A2E">
<title>Centro de Control — Movistar Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Yellowtail&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Diseño "Afiche" (cianotipo / plano técnico, vintage moderno): el azul marino del Arena
   como papel de plano, con un grano muy suave; bloques planos y rectos, sin redondeos,
   sombras, desenfoque ni degradés. Títulos en Poppins muy pesada y en mayúsculas, con una
   palabra manuscrita (Yellowtail) de acento; los rótulos y los botones, en Poppins
   seminegrita y en mayúsculas espaciadas (Poppins en todo). El único color fuerte es la gravedad (grave en rojo, media en ámbar, leve con
   contorno), en bloques, y siempre con su nombre escrito. Lo elegido,
   en bloque crema. En la compu, los controles de 40 px; en lo táctil, de 44. */
:root{
  --inc-fuente:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  
  --mano:'Yellowtail',cursive;
  --fondo:#09203C;--bloque:#17365F;--bloque-2:#1E4372;
  --crema:#F4F1EA;--crema-2:#ECE7DD;--gris:#C9C2B5;--linea:rgba(244,241,234,.22);
  /* La gravedad: de fondo, el tono oscuro de su color; la letra, el mismo tono, claro. */
  --celeste:#019DF4;   /* el celeste de la marca (las cifras del resumen del show y el informe) */
  --celeste-osc:#003150;--celeste-letra:#019DF4;   /* el resumen del show: fondo oscuro y la letra en el celeste (4,6 a 1) */
  --grave:#A11D21;--grave-letra:#FFD2CF;--media:#B8900A;--media-letra:#FFF4C4;--leve:#4E5560;--leve-letra:#E4E7EC;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Los botones y los campos, con la misma letra (el navegador les pone la suya). */
button,input,select,textarea,optgroup,option{font-family:inherit}
/* El papel: azul marino con un grano chico que se repite (128 px, no se calcula en vivo). */
body{font-family:var(--inc-fuente);background:var(--fondo) url(grano.png);color:var(--crema);font-size:14px;min-height:100vh;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
/* La palabra manuscrita de acento: nunca en datos ni en botones. */
.mano{display:inline-block;font:400 1em/1 var(--mano);text-transform:none;letter-spacing:0}
/* Los rótulos: mono, en mayúsculas espaciadas. */
.rot{font:600 12.5px var(--inc-fuente);letter-spacing:0;color:var(--gris)}
/* Los títulos de sección: enteros en la letra manuscrita, grandes (a igual tamaño se ve más chica que Poppins). */
/* En la manuscrita, el tilde que va después de una mayúscula choca con su último trazo (la é de "Métricas"): un poco de aire. */
.tilde-aire{margin-left:.1em}
.sec-t{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 .28em;font:400 56px/1.05 var(--mano);letter-spacing:0;padding-top:.05em}
.sec-t .mano{font-size:1em;transform:none}
/* La barra de arriba: el logo y la marca (AX, Show Business Solutions, la frase) y, a la derecha, en vivo, actualizar, el informe y salir. */
.bar{position:sticky;top:0;z-index:30;min-height:60px;padding:calc(env(safe-area-inset-top,0px) + 9px) max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;background:var(--bloque);border-bottom:2px solid var(--crema)}
.bar-logo{width:34px;height:34px;flex-shrink:0;display:block}
.bar-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bar-t{font:800 14.5px/1.1 var(--inc-fuente);letter-spacing:0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar-s{font:400 12px var(--inc-fuente);color:var(--gris);white-space:nowrap}
.bar .rot{font-weight:400}.bar .rot b{font-weight:800}.bar .rot .mano{font-size:1.35em}
/* En el celular, la marca en dos renglones (entera, sin puntos suspensivos). */
@media(max-width:560px){.bar-t{white-space:normal;font-size:12.5px;line-height:1.05}}
.bar-acc{display:flex;gap:4px;align-items:center;flex-shrink:0}
.bar-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:0;border-radius:0;background:var(--fondo);color:var(--crema);font:600 13px var(--inc-fuente);letter-spacing:0;cursor:pointer;flex-shrink:0;transition:background .15s}
.bar-btn:hover{background:var(--bloque-2)}
.bar-btn.prim{background:var(--crema);color:var(--fondo)}.bar-btn.prim:hover{background:#fff}
.bar-btn.ico{width:40px;padding:0}
.bar-btn svg{width:17px;height:17px;flex-shrink:0}
.inc-vivo{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--crema);color:var(--fondo);font:600 13px var(--inc-fuente);letter-spacing:0;white-space:nowrap}
.inc-vivo::before{content:'';width:8px;height:8px;background:var(--fondo);animation:incLatido 1.6s infinite}
.inc-vivo.mal{background:var(--media);color:var(--media-letra)}.inc-vivo.mal::before{background:var(--media-letra)}.inc-vivo.mal::before{animation:none}
.atras{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border:0;border-radius:0;background:var(--fondo);color:var(--crema);font-size:18px;cursor:pointer}
.atras:hover{background:var(--bloque-2)}
button:focus-visible,.show:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
@media(max-width:760px){.bar-s{display:none}#btnActualizar{display:none}}
@media(max-width:560px){#btnSalir span,.bar-acc .bar-btn span,.bar .rot{display:none}#btnSalir,.bar-acc .bar-btn{width:44px;padding:0}}
.wrap{max-width:1180px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.pantalla{display:none}.pantalla.on{display:block}
/* El ingreso: un bloque plano. */
.login{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--bloque);color:var(--crema);padding:28px 24px 24px;width:100%;max-width:400px}
/* Las dos marcas juntas, como una colaboración: el SBS calado (las letras, del azul del bloque) y la M de Movistar. */
.login-marcas{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 20px}
.login-logo{width:68px;height:68px;display:block}
.login-m{height:50px;width:auto;display:block}
/* La ×: dibujada, de trazo firme y puntas redondas, como las curvas de la M. */
.login-y{width:18px;height:18px;flex-shrink:0;display:block}.login-y path{stroke:var(--crema);stroke-width:3.6;stroke-linecap:round;fill:none}
.login-t{font:900 34px/.92 var(--inc-fuente);letter-spacing:-.015em;text-transform:uppercase;text-align:center;margin:0 0 26px}
.login-t .mano{display:block;font-size:.78em;margin-top:8px;transform:rotate(-4deg)}
.lbl{display:block;font:600 13px var(--inc-fuente);letter-spacing:0;color:var(--gris);margin-bottom:6px}
/* 16 px: en el iPhone, con menos, la página se agranda sola al tocar el campo. */
.in{width:100%;min-height:46px;padding:10px 12px;border:2px solid var(--linea);border-radius:0;font:16px var(--inc-fuente);outline:none;margin-bottom:16px;background:var(--fondo);color:var(--crema)}
.in:focus{border-color:var(--crema)}
/* Lo que autocompleta el navegador, también azul oscuro (si no, lo pinta celeste). */
.in:-webkit-autofill,.in:-webkit-autofill:hover,.in:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px var(--fondo) inset;-webkit-text-fill-color:var(--crema);caret-color:var(--crema)}
.btn-ok{width:100%;min-height:50px;background:var(--crema);color:var(--fondo);border:0;border-radius:0;font:600 15px var(--inc-fuente);letter-spacing:0;cursor:pointer}
.btn-ok:hover{background:#fff}
.btn-ok:disabled{background:var(--bloque-2);color:var(--gris);cursor:default}
.err{display:none;background:var(--grave);color:var(--crema);padding:10px 12px;font:400 12px var(--inc-fuente);margin-bottom:14px}
/* Los shows: bloques planos; el de hoy, con el contorno crema. */
.titulo{margin:0 0 8px}
.titulo-s{font:400 12px var(--inc-fuente);color:var(--gris)}
.grupo{font:600 13.5px var(--inc-fuente);letter-spacing:0;color:var(--gris);margin:28px 0 8px}
.shows-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:4px}
.show{padding:14px 16px;min-height:78px;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--bloque);color:var(--crema);transition:background .15s}
.show:hover{background:var(--bloque-2)}
.show.hoy{outline:2px solid var(--crema);outline-offset:-2px}
.show-main{flex:1;min-width:0}
.show-n{font:700 16px/1.2 var(--inc-fuente);display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:0}
.show-f{font:400 11px var(--inc-fuente);color:var(--gris);margin-top:5px}
.show-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.vivo-pill{font:600 11.5px var(--inc-fuente);letter-spacing:0;color:var(--fondo);background:var(--crema);padding:3px 7px;display:inline-flex;align-items:center;gap:5px}
.vivo-pill::before{content:'';width:6px;height:6px;background:var(--fondo);animation:incLatido 1.4s infinite}
.flecha{color:var(--gris);font-size:22px}
.vacio{text-align:center;padding:32px 18px;color:var(--gris);font:400 12px/1.5 var(--inc-fuente);border:2px dashed var(--linea)}
.inc-cuenta{font:400 11px var(--inc-fuente);padding:4px 8px;background:var(--fondo);color:var(--gris)}
.inc-cuenta strong{font-weight:700;margin-right:5px;color:var(--crema)}
/* Lo abierto por gravedad: un bloque del color de su gravedad (fondo oscuro, letra clara). */
.inc-cuenta.n3{background:var(--grave);color:var(--grave-letra)}.inc-cuenta.n3 strong{color:inherit}
.inc-cuenta.n2{background:var(--media);color:var(--media-letra)}.inc-cuenta.n2 strong{color:inherit}
.inc-cuenta.n1{background:var(--leve);color:var(--leve-letra)}.inc-cuenta.n1 strong{color:inherit}
/* El tablero de un show: el nombre enorme y el estado de la sala; el plano grande y, al costado, los tickets; abajo, el informe. */
.tablero{max-width:1880px;margin:0 auto;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.pase{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px;margin-bottom:34px}
.pase-id{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:0 24px 0 0}
/* El nombre del show: las palabras nunca se cortan; el tamaño lo ajusta ajustarNombre() (cada palabra entera, dos renglones como mucho); aire arriba para las tildes. */
.pase-n{font:900 clamp(52px,12vw,150px)/.9 var(--inc-fuente);letter-spacing:-.035em;text-transform:uppercase;overflow-wrap:normal;word-break:normal;hyphens:none;padding-top:.1em}
.pase-n .mano{font-size:max(.36em,24px);margin-left:.2em;transform:rotate(-8deg) translateY(-.45em)}
.pase-f{font:400 13px var(--inc-fuente);letter-spacing:0;color:var(--gris);padding-top:10px;border-top:4px solid var(--crema)}
.pase-centro{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:4px}
/* El estado de la sala: un bloque; rojo si hay graves, amarillo si hay medias (fondo oscuro, letra clara), crema si está todo en orden. */
.estado{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:16px 18px;background:var(--crema);color:var(--fondo)}
.estado svg{grid-column:1;grid-row:1/3;width:28px;height:28px}
.estado>span:not(.hace){grid-column:2;grid-row:1;font:900 30px/.95 var(--inc-fuente);text-transform:uppercase;letter-spacing:-.005em}
.estado .hace{grid-column:3;grid-row:1;font:600 13px var(--inc-fuente);letter-spacing:0;white-space:nowrap;align-self:start}
.estado small{grid-column:2/4;grid-row:2;font:400 11.5px/1.45 var(--inc-fuente);letter-spacing:.03em}
.estado.grave{background:var(--grave);color:var(--grave-letra)}.estado.medio{background:var(--media);color:var(--media-letra)}
/* Lo abierto por gravedad (un bloque por nivel), lo resuelto y el total. */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stat{--c:var(--gris);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:10px;min-height:86px;padding:11px 12px;border:0;border-radius:0;background:var(--bloque);color:var(--crema);text-align:left;font:inherit;cursor:pointer;min-width:0;transition:background .15s}
.stat:hover{filter:brightness(1.12)}
.stat-t{display:flex;align-items:center;gap:7px;max-width:100%;font:600 13px var(--inc-fuente);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-t i{display:none}
/* Lo abierto, en bloques del color de su gravedad (siempre, aunque esté en cero): fondo oscuro, letra clara. Lo resuelto y el total, en cero, apagados. */
.stat.cero{color:var(--gris)}
.stat.k-3{background:var(--grave);color:var(--grave-letra)}
.stat.k-2{background:var(--media);color:var(--media-letra)}
.stat.k-1{background:var(--leve);color:var(--leve-letra)}
.stat-n{display:flex;align-items:baseline;gap:6px;min-width:0}
.stat b{font:900 44px/.85 var(--inc-fuente)}
.stat small{font:400 10.5px var(--inc-fuente);color:var(--gris)}
.stat:not(.cero) small,.stat.k-3 small,.stat.k-2 small,.stat.k-1 small{color:inherit;opacity:.8}
/* El que se tocó (filtra la lista): un borde crema. */
.stat.on{outline:3px solid var(--crema);outline-offset:-3px}
/* La grave abierta: un cuadradito que late, como el de "en vivo". */
.stat.pulso .stat-t::before{content:'';width:8px;height:8px;flex-shrink:0;background:currentColor;animation:incLatido 1.2s infinite}
/* En el celular: los números de a tres arriba y dos abajo. */
@media(max-width:700px){.pase-id{padding:0 0 12px}.stats{grid-template-columns:repeat(6,minmax(0,1fr))}.stat{grid-column:span 2}.stat:nth-child(n+4){grid-column:span 3}.stat small{display:none}.estado>span:not(.hace){font-size:24px}}
/* Las botoneras: bloques planos de a uno; el elegido, en crema. */
.herr{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:4px}
.seg button{border:0;border-radius:0;background:var(--bloque);font:600 13px var(--inc-fuente);letter-spacing:0;color:var(--crema);padding:0 14px;min-height:40px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;transition:background .15s}
.seg button:hover{background:var(--bloque-2)}
.seg button.on{background:var(--crema);color:var(--fondo)}
.seg button svg{width:14px;height:14px;flex-shrink:0}
.seg.chico button{padding:0 12px}
.t-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:30px}
.t-grid>*{min-width:0}
.t-plano{--tj-muesca:var(--fondo)}
.t-plano-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 0 12px}
.t-lista{display:flex;flex-direction:column;--tj-muesca:var(--fondo)}
.t-lista-cab{padding:0 0 10px}
.t-lista-t{margin-bottom:14px}
.t-lista-cab .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.t-lista-cuerpo{padding:0}
@media(min-width:960px){
  .t-grid{grid-template-columns:minmax(0,1fr) 420px;align-items:start}
  #plano{height:calc(100vh - 170px);min-height:520px}
  #plano>svg{height:calc(100% - 44px)!important}
  .t-lista{position:sticky;top:78px;height:calc(100vh - 96px);min-height:560px}
  .t-lista-cuerpo{flex:1;overflow-y:auto}
}
@media(min-width:1500px){.t-grid{grid-template-columns:minmax(0,1fr) 460px}}
.fila{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;font:600 12.5px var(--inc-fuente);letter-spacing:0;background:var(--bloque);border:0;color:var(--crema);border-radius:0;padding:0 12px;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--bloque-2)}
.chip.on{background:var(--crema);color:var(--fondo)}
.inc-lugares{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 0;align-items:center}
@keyframes incLatido{0%,100%{opacity:1}50%{opacity:.25}}
.met-t{margin:44px 0 16px}
#metricas{--tj-muesca:var(--fondo)}
/* El resumen del show (lo pone el plano): un bloque celeste, para que corte con el resto, como las cajas de gravedad: de fondo, el celeste oscuro; la letra, el mismo celeste, claro; las cifras (muy pesadas) y las barras, en el celeste de la marca. */
.pantalla .inc-met{--met-linea:rgba(1,157,244,.28);background:var(--celeste-osc);color:var(--celeste-letra);padding:18px 20px 20px}
.pantalla .inc-met-intro{color:var(--celeste-letra);font-size:13px;margin-bottom:16px}
.pantalla .inc-tiles{gap:0;margin-bottom:18px;border-bottom:1px solid var(--met-linea)}
.pantalla .inc-tile{background:transparent;border:0;border-right:1px solid var(--met-linea);border-radius:0;padding:4px 18px 16px}
.pantalla .inc-tile::before{display:none}
.pantalla .inc-tile:first-child{padding-left:0}.pantalla .inc-tile:last-child{border-right:0}
.pantalla .inc-tiles.angosto .inc-tile{border-right:0;border-bottom:1px solid var(--met-linea);padding-left:0}.pantalla .inc-tiles.angosto .inc-tile:last-child{border-bottom:0}
.pantalla button.inc-tile:hover{box-shadow:none}.pantalla .inc-tile.on{box-shadow:inset 0 -4px 0 var(--celeste)}
.pantalla .inc-tile-e{font:600 13px var(--inc-fuente);color:var(--celeste-letra)}
.pantalla .inc-tile-v{font:900 42px/1 var(--inc-fuente);letter-spacing:-.02em;color:var(--celeste);margin-top:8px}
.pantalla .inc-tile-s{font:400 12.5px var(--inc-fuente);color:var(--celeste-letra);margin-top:6px}
.pantalla .inc-tile-ir{font:600 12.5px var(--inc-fuente);color:var(--celeste-letra)}
.pantalla .inc-graf-card{background:transparent;border:0;border-radius:0;padding:0}
.pantalla .inc-graf-t{font:600 13.5px var(--inc-fuente);color:var(--celeste-letra);margin-bottom:8px}
.pantalla .inc-g-t{fill:#019DF4}.pantalla .inc-g-s{fill:#019DF4}.pantalla .inc-g-barra{fill:#019DF4}
.pantalla .inc-marca:focus-visible{outline-color:var(--celeste-letra)}
.pantalla .inc-met-tip{background:var(--fondo);color:var(--crema-2);border-radius:0;box-shadow:none}.pantalla .inc-met-tip .v{color:var(--crema)}
.pantalla .inc-met-vacio{background:var(--celeste-osc);border:0;border-radius:0;color:var(--celeste-letra)}
/* Los tickets (los pone el plano): bloques planos; el talón, del color de su gravedad. */
.pantalla{--tj-tinta:#F4F1EA;--tj-tinta2:#C9C2B5;--tj-perf:rgba(244,241,234,.22);--tj-ok:#ECE7DD;--tj-mal:#FFD700}
.pantalla .inc-tj{background:var(--bloque);border:0;border-radius:0;margin-bottom:4px;outline-offset:-2px}
.pantalla .inc-tj:hover{outline-color:rgba(244,241,234,.45)}.pantalla .inc-tj.abierta{outline-color:var(--crema)}
.pantalla .inc-tj-cab{grid-template-columns:78px minmax(0,1fr)}
.pantalla .inc-tj-cab::before,.pantalla .inc-tj-cab::after{display:none}
.pantalla .inc-card.inc-tj .inc-tj-talon{border-radius:0;padding:10px 6px;gap:6px}
.pantalla .inc-tj[data-nivel="3"] .inc-tj-talon{background:var(--grave);color:var(--grave-letra)}
.pantalla .inc-tj[data-nivel="2"] .inc-tj-talon{background:var(--media);color:var(--media-letra)}
.pantalla .inc-tj[data-nivel="1"] .inc-tj-talon{background:var(--leve);color:var(--leve-letra)}
.pantalla .inc-tj .inc-tj-talon b{font:900 24px/.9 var(--inc-fuente)}
.pantalla .inc-tj .inc-tj-talon small{font:600 11.5px var(--inc-fuente);letter-spacing:0}
.pantalla .inc-tj .inc-tj-txt{border-left:0;padding:11px 14px;gap:4px}
.pantalla .inc-tj .inc-tj-tipo{font:700 15px/1.2 var(--inc-fuente)}

async function abrirShow(id, fecha) {
  const s = shows.find(x => x.id === id); if (!s) return;
  // La fecha es el show: el tablero, el resumen y el informe son de ella.
  showId = id; lista = []; filtro = 'abiertas'; sectorSel = ''; dia = fecha !== undefined ? fecha : fechaInicial(s); vistos = null; nuevos = new Set(); nivelSel = 0; focoInc = catSel = franjaSel = '';
  pantalla('pShow');
  // El plano del anillo como lo dejó el panel (puertas, gastronomía, baños…) y el armado
  // del campo del show: se piden antes de dibujar, así el 3D los espera y se arma una vez.
  const plano = incRefrescarPlano();
  render();
  await cargarIncidencias();
  if (await plano) render();
  clearInterval(timer);
  // En vivo: cada 15 segundos, mientras se está mirando (y el plano, por si lo cambiaron).
  timer = setInterval(() => {
    if (!document.getElementById('pShow').classList.contains('on') || document.hidden) return;
    cargarIncidencias();
    incRefrescarPlano().then(c => { if (c) render(); });
  }, 15000);
}
function volverShows() {
  clearInterval(timer); showId = null;
  pantalla('pShows'); cargarShows();
}

  vivo.textContent = 'En vivo'; vivo.title = 'Actualizado a las ' + incHora(new Date().toISOString()); vivo.className = 'inc-vivo';
  lista = data || [];
  nuevos = vistos ? new Set(lista.filter(i => !vistos.has(i.id)).map(i => i.id)) : new Set();
  vistos = new Set(lista.map(i => i.id));
  render();
}

}
