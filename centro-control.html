<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Centro de Control — Movistar Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#eceef1;color:#111827;font-size:14px;min-height:100vh;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
/* La marca de fondo: el wallpaper de SBS, muy suave, detrás de todo (como siempre). */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:url('fondo-sbs.jpg') center/cover no-repeat;opacity:.07}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.55),rgba(236,238,241,0) 70%)}
.bar,.pantalla{position:relative;z-index:1}
/* La barra de arriba: clara, con el logo y sólo lo justo (qué show, si está en vivo, el informe y salir) */
.bar{background:rgba(246,247,249,.92);color:#111827;position:sticky;top:0;z-index:30;min-height:56px;padding:calc(env(safe-area-inset-top,0px) + 8px) 18px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e3e6ea;-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px)}
.bar-logo{width:32px;height:32px;flex-shrink:0;display:block}
.bar-txt{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.bar-t{font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar-s{font-size:12px;color:#6b7280;white-space:nowrap;flex-shrink:0}
.bar-acc{display:flex;gap:6px;align-items:center;flex-shrink:0}
.bar-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1px solid #dfe2e7;color:#1f2937;border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s}
.bar-btn:hover{border-color:#b9bfc9}
.bar-btn.ico{width:34px;height:32px;padding:0}
.bar-btn svg{width:15px;height:15px}
.bar .inc-vivo{color:#15803d;font-weight:600}
.atras{background:none;border:none;color:#374151;font-size:20px;cursor:pointer;padding:2px 6px;flex-shrink:0;border-radius:8px}
.atras:hover{background:#e9ebef}
@media(max-width:760px){.bar{gap:8px;padding-left:10px;padding-right:10px}.bar-logo{width:28px;height:28px}.bar-s{display:none}.bar .inc-vivo{font-size:0;gap:0}.bar-t{font-size:14px}}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.pantalla{display:none}.pantalla.on{display:block}
/* Ingreso */
.login{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:30px 28px;width:100%;max-width:370px;box-shadow:0 24px 60px rgba(17,24,39,.12)}
.login-logo{width:58px;height:58px;display:block;margin:0 auto 14px}
.login-t{font-size:19px;font-weight:700;text-align:center;letter-spacing:-.3px}
.login-s{font-size:12px;color:#6b7280;text-align:center;margin:4px 0 22px}
.lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:5px}
.in{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;outline:none;margin-bottom:14px;background:#fff}
.in:focus{border-color:#2b2b2b;box-shadow:0 0 0 3px rgba(43,43,43,.12)}
.btn-ok{width:100%;padding:13px;background:#2b2b2b;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn-ok:hover{background:#1f1f1f}
.err{display:none;background:#ffe9ee;color:#9f1239;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
/* Los shows */
.titulo{font-size:20px;font-weight:700;letter-spacing:-.3px;margin:6px 2px 2px}
.titulo-s{font-size:12.5px;color:#6b7280;margin:0 2px 6px}
.grupo{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#6b7280;margin:20px 2px 8px}
.shows-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.show{background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:box-shadow .15s,transform .15s}
.show:hover{box-shadow:0 8px 24px rgba(16,24,40,.1);transform:translateY(-1px)}
.show-main{flex:1;min-width:0}
.show-n{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.show-f{font-size:12px;color:#6b7280;margin-top:2px}
.show-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.vivo-pill{font-size:10px;font-weight:700;letter-spacing:.5px;color:#fff;background:#9f1239;border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:5px}
.vivo-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:incLatido 1.4s infinite}
.flecha{color:#c4c8cf;font-size:18px}
.vacio{text-align:center;padding:40px 18px;color:#6b7280;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:14px}
/* El tablero: arriba los números y la botonera; el plano grande y, al costado, el listado */
.tablero{max-width:1880px;margin:0 auto;padding:16px 20px 28px}
.t-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:1 1 700px;max-width:880px}
.stat{--c:#2b2b2b;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:12px;padding:9px 14px 9px 12px;display:flex;align-items:center;gap:12px;min-width:0;min-height:58px;box-shadow:0 1px 2px rgba(16,24,40,.05);font:inherit;color:inherit;text-align:left;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s}
.stat i{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0;background:var(--c)}
.stat div{min-width:0}
.stat b{display:block;font-size:22px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:#6b7280;line-height:1.2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat:hover{box-shadow:0 6px 16px rgba(16,24,40,.1);transform:translateY(-1px)}
.stat.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 6px 16px rgba(16,24,40,.1)}
.stat:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.stat.pulso{animation:incPulso 1.3s ease-in-out infinite}
@media(max-width:700px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));flex-basis:100%}}
.herr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:#e2e5ea;border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font-size:12.5px;font-weight:600;color:#4b5563;padding:7px 12px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:#111827}
.seg button.on{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(16,24,40,.14)}
.seg button svg{width:15px;height:15px;flex-shrink:0}
.seg.chico button{font-size:12px;padding:6px 10px}
.t-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.t-grid>*{min-width:0}
.t-plano{background:rgba(255,255,255,.96);border-radius:18px;padding:10px;border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 30px rgba(16,24,40,.07)}
.t-lista{background:rgba(255,255,255,.96);border-radius:18px;border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 30px rgba(16,24,40,.07);display:flex;flex-direction:column;overflow:hidden}
.t-lista-cab{padding:14px 14px 10px;border-bottom:1px solid #eef0f3}
.t-lista-t{font-size:15px;font-weight:700;letter-spacing:-.2px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.t-lista-t small{font-size:11.5px;font-weight:500;color:#6b7280}
.t-lista-cuerpo{padding:12px}
@media(min-width:960px){
  .t-grid{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
  #plano{height:calc(100vh - 214px);min-height:520px}
  #plano>svg{height:calc(100% - 44px)!important}
  .t-lista{position:sticky;top:78px;height:calc(100vh - 152px);min-height:580px}
  .t-lista-cuerpo{flex:1;overflow-y:auto}
}
@media(min-width:1500px){.t-grid{grid-template-columns:minmax(0,1fr) 430px}}
.fila{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inc-cuenta{font-size:12px;padding:5px 10px;border-radius:999px;background:#f1f1f4;color:#5b5b66}
.inc-cuenta strong{font-size:14px;margin-right:3px}
.chip{font-size:11.5px;font-weight:600;background:#fff;border:1px solid #d6dae1;color:#4b5563;border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.chip.on{background:#2b2b2b;border-color:#2b2b2b;color:#fff}
.inc-lugares{display:flex;flex-wrap:wrap;gap:6px;margin:10px 2px 2px;align-items:center}
.inc-lugares-t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;margin-right:4px}
.inc-lugar{font-size:12px;font-weight:600;background:#f5f6f8;border:1px solid #e2e5ea;color:#374151;border-radius:9px;padding:6px 10px;cursor:pointer}
.inc-lugar:hover{border-color:#c3c8d0}
.inc-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-left:4px solid #d1d5db;border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.inc-card.resuelta{opacity:.72}
.inc-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inc-tipo{font-size:14px;font-weight:600;flex:1;min-width:0}
.inc-hora{font-size:12px;color:#6b7280;font-variant-numeric:tabular-nums}
.inc-donde{font-size:12px;color:#6b7280;margin-top:3px}
.inc-donde b{color:#374151;font-weight:600}
.inc-acc{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:5px;font-size:12px;color:#15803d}
.inc-nota{font-size:13px;color:#374151;margin-top:5px;white-space:pre-wrap}
.inc-res{font-size:12.5px;color:#374151;margin-top:7px;background:#f6f6f8;border-radius:8px;padding:6px 9px}
.inc-vivo{font-size:11px;color:#15803d;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.inc-vivo::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;animation:incLatido 1.6s infinite}
.inc-vivo.mal{color:#9f1239}
@keyframes incLatido{0%,100%{opacity:1}50%{opacity:.25}}
.inc-card.nueva{animation:incLlega 1.6s ease-out}
@keyframes incLlega{0%{transform:translateY(-10px);opacity:0}25%{transform:none;opacity:1;background:#fff3bf}100%{background:#fff}}
@keyframes incPulso{0%,100%{box-shadow:0 0 0 0 rgba(159,18,57,.45)}50%{box-shadow:0 0 0 6px rgba(159,18,57,0)}}
.met-t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#6b7280;margin:24px 2px 10px}
.pie{text-align:center;font-size:11px;color:#9ca3af;padding:20px 10px 30px;display:flex;align-items:center;justify-content:center;gap:8px}
.pie img{width:18px;height:18px;opacity:.85}
@media(max-width:520px){.wrap{padding:12px}.tablero{padding:10px}.t-plano{padding:6px;border-radius:14px}.stat{padding:8px 10px;gap:9px;min-height:52px}.stat b{font-size:18px}.stat span{font-size:10.5px}}
</style>
</head>
<body>

<header class="bar">
  <button class="atras" id="btnAtras" onclick="volverShows()" style="display:none" aria-label="Volver a los shows">←</button>
  <img class="bar-logo" src="logo-sbs.png" alt="SBS">
  <div class="bar-txt">
    <span class="bar-t" id="barT">Centro de Control</span>
    <span class="bar-s" id="barS"></span>
  </div>
  <div class="bar-acc" id="barAcc" style="display:none">
    <span class="inc-vivo" id="vivo">En vivo</span>
    <button class="bar-btn ico" onclick="cargarIncidencias()" title="Actualizar ahora" aria-label="Actualizar ahora"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="bar-btn ico" onclick="informe()" title="Informe del show (PDF)" aria-label="Informe del show en PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
  </div>
  <button class="bar-btn" id="btnSalir" onclick="salir()" style="display:none">Salir</button>
</header>

<!-- Ingreso -->
<div class="pantalla on" id="pLogin">
  <div class="login">
    <div class="login-card">
      <img class="login-logo" src="logo-sbs.png" alt="SBS">
      <div class="login-t">Centro de Control</div>
      <div class="login-s">Movistar Arena · Show Business Solutions</div>
      <label class="lbl">Email</label>
      <input class="in" type="email" id="lgEmail" autocomplete="username" placeholder="tu@email.com" onkeydown="if(event.key==='Enter')ingresar()">
      <label class="lbl">Contraseña</label>
      <input class="in" type="password" id="lgPass" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')ingresar()">
      <div class="err" id="lgErr"></div>
      <button class="btn-ok" id="lgBtn" onclick="ingresar()">Ingresar</button>
    </div>
  </div>
</div>

<!-- Los shows del Arena -->
<div class="pantalla" id="pShows">
  <div class="wrap">
    <div class="titulo">Shows del Movistar Arena</div>
    <div class="titulo-s">Elegí un show para ver sus incidencias en vivo.</div>
    <div id="showsBody"><div class="vacio">Cargando…</div></div>
  </div>
</div>

<!-- El tablero de un show: el plano grande y, al costado, las incidencias -->
<div class="pantalla" id="pShow">
  <div class="tablero">
    <div class="t-cab">
      <div class="stats" id="resumen"></div>
      <div class="herr" id="vistas"></div>
    </div>
    <div class="t-grid">
      <section class="t-plano">
        <div id="plano" data-alto="pantalla"></div>
        <div class="inc-lugares" id="lugares"></div>
      </section>
      <aside class="t-lista">
        <div class="t-lista-cab">
          <div class="t-lista-t" id="listaT">Incidencias</div>
          <div class="fila" id="filtros"></div>
        </div>
        <div class="t-lista-cuerpo" id="lista"></div>
      </aside>
    </div>
    <div class="met-t">Métricas del show</div>
    <div id="metricas"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://nkmmifyzliiimmtlzeqo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rbW1pZnl6bGlpaW1tdGx6ZXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMjM0MTAsImV4cCI6MjA5NjY5OTQxMH0.QU5JBRH_rbTzUu12oeWmCDmJv6B3UUVKPA5HyeuuzSg';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ── INCIDENCIAS: catálogo, semáforo y plano ─────────────────────
// Este bloque es idéntico en admin.html y supervisor-mobile.html (una prueba
// lo vigila): lo que carga el supervisor en la tablet y lo que ve el panel
// tienen que hablar el mismo idioma. Sin datos del público: sólo qué pasó,
// dónde y qué se hizo.
const INC_NIVELES = {
  1: { nombre: 'Leve',     ayuda: 'Se resuelve en el lugar',                   color: '#15803d', fondo: '#dcfce7', plano: '#86efac' },
  2: { nombre: 'Moderado', ayuda: 'Hace falta otra área',                      color: '#a16207', fondo: '#fef6da', plano: '#fcd34d' },
  3: { nombre: 'Grave',    ayuda: 'Interviene alguien de afuera o hay riesgo', color: '#9f1239', fondo: '#ffe9ee', plano: '#fb7185' }
};
// Cada categoría: sus tipos (con el nivel que traen por defecto) y el
// check-list de lo que corresponde hacer. Es una propuesta para arrancar:
// se ajusta con la gente del Arena.
const INC_CATALOGO = [
  { cat: 'Médica', tipos: [['Desmayo / descompensación', 2], ['Lesión o caída', 2], ['Persona alcoholizada o intoxicada', 2], ['Emergencia médica grave', 3]],
    acciones: ['Se llamó a socorrismo', 'Se asistió en el lugar', 'Se trasladó a enfermería', 'Se derivó en ambulancia (SAME)'] },
  { cat: 'Seguridad', tipos: [['Pelea o agresión', 3], ['Persona agresiva o molesta', 2], ['Ingreso indebido / sin entrada', 2], ['Objeto prohibido', 1], ['Robo o hurto', 2]],
    acciones: ['Se avisó a seguridad', 'Se retiró a la persona del sector', 'Se retuvo el objeto', 'Se dio aviso a la policía'] },
  { cat: 'Ubicación', tipos: [['Cambio de ubicación', 1], ['Ubicación ocupada', 1], ['Entrada duplicada', 2], ['Persona fuera de su sector', 1]],
    acciones: ['Se reubicó a la persona', 'Se verificó la entrada', 'Se consultó a boletería', 'Se acompañó a su ubicación'] },
  { cat: 'Infraestructura', tipos: [['Derrame / piso resbaladizo', 1], ['Butaca o baranda rota', 1], ['Baño fuera de servicio', 1], ['Falla eléctrica o de iluminación', 2], ['Salida obstruida', 3]],
    acciones: ['Se avisó a mantenimiento', 'Se señalizó o se cerró el paso', 'Se limpió', 'Se liberó el paso'] },
  { cat: 'Personal', tipos: [['Falta personal en el sector', 2], ['Personal descompuesto', 2], ['Problema de conducta o uniforme', 1]],
    acciones: ['Se cubrió con otra persona', 'Se avisó a coordinación', 'Se relevó a la persona'] },
  { cat: 'Otro', tipos: [['Otra incidencia', 1]],
    acciones: ['Se avisó a coordinación', 'Se resolvió en el lugar'] }
];
function incCategoria(cat) { return INC_CATALOGO.find(c => c.cat === cat) || INC_CATALOGO[INC_CATALOGO.length - 1]; }
function incNivelDe(cat, tipo) { const t = incCategoria(cat).tipos.find(x => x[0] === tipo); return t ? t[1] : 1; }
// Lugares que no están dibujados en el plano (el anillo, con sus puertas,
// la gastronomía y los baños, sí lo está).
const INC_LUGARES = ['Fila de ingreso · Humboldt', 'Fila de ingreso · Corrientes', 'Fila de ingreso · Dorrego', 'Otro lugar'];
// Los pasillos y escaleras van por sector: se elige el sector y, en la
// referencia, un atajo de un toque.
const INC_REFERENCIAS = ['Pasillo', 'Escalera', 'Vomitorio', 'Fila', 'Butaca'];
function incRefRapidaHTML(idCampo) { return '<div class="inc-ref-rapida">' + INC_REFERENCIAS.map(r => '<button type="button" onclick="incRefRapida(\'' + idCampo + '\',\'' + r + '\')">' + r + '</button>').join('') + '</div>'; }
function incRefRapida(idCampo, r) {
  const el = document.getElementById(idCampo); if (!el) return;
  const v = String(el.value || '').trim();
  el.value = v ? (new RegExp('(^|· )' + r + '( |$)').test(v) ? v : v + ' · ' + r) : r;
  if (el.focus) el.focus();
}
// Las incidencias son sólo de los shows del Movistar Arena.
function incEsArena(area) { return /arena|movistar/i.test(String(area || '')); }
function incEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function incHora(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
// El día (AAAA-MM-DD, hora de acá): una convocatoria del Arena puede tener
// muchas fechas, y cada fecha es un show.
function incDia(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// "21:34" si es de hoy; "24/10 21:34" si es de otro día.

  document.getElementById('vistas').innerHTML = seg([['3d', '3D'], ['2d', 'Plano']], vista, 'elegirVista') + seg([['campos', 'Campo de pie'], ['asientos', 'Con asientos']], armado, 'elegirArmado');
  incMontarPlano(document.getElementById('plano'), { armado, niveles: res.niveles, cuentas: res.cuentas, sel: sectorSel, onclick: 'tocarSector', titulo: (shows.find(x => x.id === showId) || {}).nombre, detalle: delD });
  const met = document.getElementById('metricas');
  if (met) incPintarMetricas(met, delD);
  document.getElementById('lugares').innerHTML = '<span class="inc-lugares-t">Otros lugares</span>' + incLugaresSueltos(delD, armado).map(l => {
    const nv = res.niveles[l], c = res.cuentas[l] || 0, sel = sectorSel === l;
    return '<button class="inc-lugar" style="' + (nv ? 'background:' + INC_NIVELES[nv].fondo + ';border-color:' + INC_NIVELES[nv].color + ';color:' + INC_NIVELES[nv].color + ';' : '') + (sel ? 'outline:2px solid #2b2b2b;' : '')
      + '" onclick="tocarSector(\'' + incEsc(l) + '\')">' + incEsc(l) + (c ? ' <strong>' + c + '</strong>' : '') + '</button>';
  }).join('');
  // Al costado, el listado: abiertas, resueltas o todas; el día; y el lugar tocado en el plano.
  const dias = [...new Set(lista.map(i => incDia(i.created_at)).filter(Boolean))].sort().reverse();
  const chip = (k, v, t, on) => '<button class="chip' + (on ? ' on' : '') + '" onclick="filtrar(\'' + k + '\',\'' + v + '\')">' + t + '</button>';
  document.getElementById('listaT').innerHTML = 'Incidencias<small>' + abiertas.length + ' abierta' + (abiertas.length === 1 ? '' : 's') + ' · ' + delD.length + ' en total</small>';
  document.getElementById('filtros').innerHTML = '<div class="seg chico">' + [['abiertas', 'Abiertas'], ['resueltas', 'Resueltas'], ['todas', 'Todas']].map(([v, t]) => '<button class="' + (filtro === v ? 'on' : '') + '" onclick="filtrar(\'estado\',\'' + v + '\')">' + t + '</button>').join('') + '</div>'
    + (dias.length > 1 || (dias.length === 1 && dia !== dias[0]) ? chip('dia', '', 'Todos los días', !dia) + dias.map(d => chip('dia', d, d.slice(8, 10) + '/' + d.slice(5, 7), dia === d)).join('') : '')
    + (nivelSel ? '<span class="chip on">' + INC_NIVELES[nivelSel].nombre + ' <span onclick="event.stopPropagation();filtrar(\'nivel\',\'\')" style="margin-left:4px;cursor:pointer">✕</span></span>' : '')
    + (sectorSel ? '<span class="chip on">' + incEsc(sectorSel) + ' <span onclick="event.stopPropagation();filtrar(\'sector\',\'\')" style="margin-left:4px;cursor:pointer">✕</span></span>' : '');
  const visibles = incOrdenar(delD).filter(i => filtro === 'todas' || (filtro === 'abiertas') === (i.estado !== 'resuelta')).filter(i => !sectorSel || i.sector === sectorSel).filter(i => !nivelSel || (i.nivel || 1) === nivelSel);
  const cont = document.getElementById('lista');
  if (!visibles.length) {
    cont.innerHTML = '<div class="vacio">' + (!lista.length ? 'Sin incidencias en este show.' : filtro === 'abiertas' ? 'No hay incidencias ' + (nivelSel ? INC_NIVELES[nivelSel].nombre.toLowerCase().replace(/o$/, 'a') + 's ' : '') + 'abiertas' + (sectorSel ? ' en ' + incEsc(sectorSel) : '') + '.' : 'Nada por acá.') + '</div>';
  } else {
    cont.innerHTML = visibles.map(i => {
      const v = INC_NIVELES[i.nivel] || INC_NIVELES[1], resuelta = i.estado === 'resuelta';
      return '<div class="inc-card' + (resuelta ? ' resuelta' : '') + (nuevos.has(i.id) ? ' nueva' : '') + '" style="border-left-color:' + v.color + '">'
        + '<div class="inc-card-top">' + incNivelChip(i.nivel) + '<span class="inc-tipo">' + incEsc(i.tipo) + '</span><span class="inc-hora">' + incCuando(i.created_at) + '</span></div>'
        + '<div class="inc-donde"><b>' + incEsc(i.sector) + '</b>' + (incZona(i.sector) ? ' · ' + incZona(i.sector) : '') + (i.ubicacion ? ' · ' + incEsc(i.ubicacion) : '') + ' · ' + incEsc(i.categoria) + '</div>'
        + ((i.acciones || []).length ? '<div class="inc-acc">' + i.acciones.map(a => '<span>✓ ' + incEsc(a) + '</span>').join('') + '</div>' : '')
        + (i.nota ? '<div class="inc-nota">' + incEsc(i.nota) + '</div>' : '')
        + (resuelta ? '<div class="inc-res"><strong>Resuelta ' + incCuando(i.resuelta_at) + '</strong> · ' + incEsc(i.resolucion || '') + '</div>' : '')
        + '</div>';
    }).join('');
  }
  nuevos = new Set();
}
// El informe del show (del día elegido), listo para guardar como PDF o imprimir.
function informe() {
  const s = shows.find(x => x.id === showId); if (!s) return;
  const l = delDia().slice().sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
  const cuenta = clave => { const m = {}; l.forEach(i => { const k = clave(i) || '—'; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const tabla = (titulo, pares) => '<h3>' + titulo + '</h3><table class="r">' + pares.map(p => '<tr><td>' + incEsc(p[0]) + '</td><td class="n">' + p[1] + '</td></tr>').join('') + '</table>';
  const cuando = dia ? dia.slice(8, 10) + '/' + dia.slice(5, 7) + '/' + dia.slice(0, 4) : resumenFechas(s);
  const fh = iso => { const d = incDia(iso); return d ? d.slice(8, 10) + '/' + d.slice(5, 7) + ' ' + incHora(iso) : ''; };
  const abiertas = l.filter(i => i.estado !== 'resuelta').length;
  const html = '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe de incidencias · ' + incEsc(s.nombre) + '</title>'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"><style>'
    + 'body{font-family:Poppins,sans-serif;color:#111827;margin:28px;font-size:11px}h1{font-size:18px;margin:0}h2{font-size:12px;font-weight:400;color:#6b7280;margin:2px 0 18px}'
    + 'h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#374151;margin:16px 0 6px}.cab{display:flex;align-items:center;gap:12px;border-bottom:2px solid #111827;padding-bottom:10px;margin-bottom:14px}'
    + '.cab img{width:38px}.res{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e5e7eb;padding:5px 6px;text-align:left;vertical-align:top}'
    + 'th{background:#111827;color:#fff;font-weight:600}.n{text-align:right;font-weight:600}.niv{font-weight:600}@media print{body{margin:12mm}}</style></head><body>'
    + '<div class="cab"><img src="' + location.origin + '/logo-sbs.png" alt=""><div><h1>Informe de incidencias · ' + incEsc(s.nombre) + '</h1><h2>Movistar Arena · ' + cuando + ' · ' + l.length + ' incidencia' + (l.length === 1 ? '' : 's') + ' · ' + abiertas + ' abierta' + (abiertas === 1 ? '' : 's') + ' · generado ' + new Date().toLocaleString('es-AR') + '</h2></div></div>'
    + '<div class="res">' + tabla('Gravedad', [3, 2, 1].map(nv => [INC_NIVELES[nv].nombre, l.filter(i => (i.nivel || 1) === nv).length])) + tabla('Categoría', cuenta(i => i.categoria)) + tabla('Sector', cuenta(i => i.sector)) + '</div>'
    + '<h3>Línea de tiempo</h3><table><tr><th>Cuándo</th><th>Sector</th><th>Qué pasó</th><th>Gravedad</th><th>Qué se hizo</th><th>Cómo se resolvió</th></tr>'
    + l.map(i => '<tr><td>' + fh(i.created_at) + '</td><td>' + incEsc(i.sector) + (i.ubicacion ? '<br><span style="color:#6b7280">' + incEsc(i.ubicacion) + '</span>' : '') + '</td><td>' + incEsc(i.tipo) + '<br><span style="color:#6b7280">' + incEsc(i.categoria) + '</span>' + (i.nota ? '<br>' + incEsc(i.nota) : '') + '</td>'
      + '<td class="niv" style="color:' + (INC_NIVELES[i.nivel] || INC_NIVELES[1]).color + '">' + (INC_NIVELES[i.nivel] || INC_NIVELES[1]).nombre + '</td><td>' + (i.acciones || []).map(incEsc).join('<br>') + '</td>'
      + '<td>' + (i.estado === 'resuelta' ? fh(i.resuelta_at) + ' · ' + incEsc(i.resolucion || '') : '<strong>Abierta</strong>') + '</td></tr>').join('')
    + '</table><script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>';
  const w = window.open('', '_blank');
  if (!w) { alert('El navegador bloqueó la ventana del informe. Permití las ventanas emergentes para este sitio.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}
iniciar();
