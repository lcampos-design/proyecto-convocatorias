<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmación — Show Business Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1a1a1a;font-size:15px;min-height:100vh;position:relative}
/* Con los colores de SBS, como el informe del show: sobre blanco, la pieza de marca en gris suave (marca de
   agua), la barra negra finita con el logo original (el SBS en su gris oscuro) y el título, y las tarjetas blancas. */
.sbs-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:url('fondo-sbs.jpg') center/cover no-repeat;opacity:.07;filter:grayscale(1)}
.page-header{background:#0f1117;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:1}
.page-logo{width:30px;height:30px;display:block}
.page-title{font-size:15px;font-weight:600;color:#fff;letter-spacing:-.2px}
.wrap{max-width:520px;margin:32px auto 60px;padding:0 16px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.97);border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:34px 26px;text-align:center}
.ic{display:flex;justify-content:center;margin-bottom:14px}.ic svg{width:60px;height:60px}
.t{font-size:20px;font-weight:700;color:#111827;margin-bottom:10px}
.center{color:#4b5563;line-height:1.6}
.note{font-size:12px;color:#9ca3af;margin-top:18px}

/* Los controles de formulario no heredan la tipografia de la pagina: hay que pedirselo. */
button,input,select,textarea,optgroup,option{font-family:inherit}
</style>
</head>
<body>
<div class="sbs-bg"></div>
<div class="page-header">
  <img class="page-logo" src="logo-sbs-blanco.png" alt="SBS">
  <div class="page-title">Confirmación de asistencia</div>
</div>
<div class="wrap"><div id="content"><div class="card"><div class="center">Registrando tu respuesta…</div></div></div></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://nkmmifyzliiimmtlzeqo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rbW1pZnl6bGlpaW1tdGx6ZXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMjM0MTAsImV4cCI6MjA5NjY5OTQxMH0.QU5JBRH_rbTzUu12oeWmCDmJv6B3UUVKPA5HyeuuzSg';
const sb = supabase.createClient(SB_URL, SB_KEY);
const q = new URLSearchParams(location.search);
const CUIT = q.get('c'), CONV = q.get('v'), RESP = (q.get('r') || '').toLowerCase(), FIRMA = q.get('f');

// Íconos dibujados, en blanco y negro: iguales en cualquier equipo.
const ICONO_SI = '<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="29" fill="#1a1a1a"/><path d="M18 31l8 8 16-17" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICONO_NO = '<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="29" fill="#fff" stroke="#0f1117" stroke-width="2.5"/><path d="M21 21l18 18M39 21L21 39" fill="none" stroke="#0f1117" stroke-width="4.5" stroke-linecap="round"/></svg>';
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function show(html){ document.getElementById('content').innerHTML = '<div class="card">' + html + '</div>'; }

async function go(){
  if (!CUIT || !CONV || (RESP !== 'si' && RESP !== 'no')) {
    show('<div class="center">Link inválido. Pedile el link a la coordinación.</div>'); return;
  }
  // Los links sin firma (los mails de antes del 30-oct) ya no sirven: la función
  // vieja se cerró el 2-nov. Se explica, en vez de tirar un error suelto.
  if (!FIRMA) {
    show('<div class="center">Este link ya no sirve. Escribile a la coordinación y te reenvían el mail para confirmar.</div>'); return;
  }
  try {
    // Con la firma de la base: sólo registra con la firma justa de esa persona y esa convocatoria.
    const { data, error } = await sb.rpc('registrar_confirmacion_firmada', { p_cuit: CUIT, p_conv_id: CONV, p_respuesta: RESP, p_firma: FIRMA });
    if (error) throw error;
    if (data && data.ok === false && data.motivo === 'firma') {
      show('<div class="center">Este link no es válido. Escribile a la coordinación y te reenvían el mail para confirmar.</div>'); return;
    }
    if (data && data.ok) {
      const nombre = data.nombre ? (', ' + String(data.nombre).split(' ')[0]) : '';
      const conv = data.convocatoria ? (' para <strong>' + esc(data.convocatoria) + '</strong>') : '';
      if (RESP === 'si') {
        show('<div class="ic">' + ICONO_SI + '</div><div class="t">¡Gracias' + esc(nombre) + '!</div>'
          + '<div class="center">Registramos que <strong>CONFIRMÁS</strong> tu asistencia' + conv + '. ¡Nos vemos!</div>'
          + '<div class="note">¿Te equivocaste? Volvé al mail y tocá el otro botón.</div>');
      } else {
        show('<div class="ic">' + ICONO_NO + '</div><div class="t">Listo' + esc(nombre) + '</div>'
          + '<div class="center">Registramos que <strong>NO vas a asistir</strong>' + conv + '. Gracias por avisar.</div>'
          + '<div class="note">¿Te equivocaste? Volvé al mail y tocá el otro botón.</div>');
      }
      return;
    }
    show('<div class="center">No pudimos registrar tu respuesta (el link puede no corresponder a una convocatoria activa). Escribinos a la coordinación.</div>');
  } catch (e) {
    // Con el detalle: si falla, que se pueda saber qué pasó sin adivinar.
    const det = e && (e.message || e.details) ? ' <span style="color:#9ca3af;font-size:12px">(' + esc((e.code ? '[' + e.code + '] ' : '') + (e.message || '') + (e.details ? ' — ' + e.details : '')) + ')</span>' : '';
    show('<div class="center">Hubo un error al registrar tu respuesta. Probá de nuevo en un rato.' + det + '</div>');
  }
}
go();
</script>
</body>
</html>
