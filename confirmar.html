<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmación — Show Business Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f5;color:#1a1a1a;font-size:15px;min-height:100vh;position:relative}
/* El mismo fondo, cabecera y pie que las demás páginas públicas (postulate, candidato). */
.page-header{background:#0f1117;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:12px;position:relative;z-index:1}
.page-logo{width:34px;height:34px;display:block;filter:brightness(0) invert(1)}
.page-title{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.2px}
.page-sub{font-size:13px;color:#fff;font-weight:600}
.page-sub::before{content:'·';margin-right:12px;color:#6b7280}
.wrap{max-width:520px;margin:32px auto 60px;padding:0 16px;position:relative;z-index:1}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:34px 26px;text-align:center}
.ic{display:flex;justify-content:center;margin-bottom:14px}.ic svg{width:60px;height:60px}
.t{font-size:20px;font-weight:700;color:#111827;margin-bottom:10px}
.center{color:#4b5563;line-height:1.6}
.note{font-size:12px;color:#9ca3af;margin-top:18px}

/* Los controles de formulario no heredan la tipografia de la pagina: hay que pedirselo. */
button,input,select,textarea,optgroup,option{font-family:inherit}
</style>
</head>
<body>
<div class="page-header">
  <img class="page-logo" src="logo-sbs.png" alt="SBS">
  <div class="page-title">Confirmación de asistencia</div>
  <div class="page-sub">Show Business Solutions</div>
</div>
<div class="wrap"><div id="content"><div class="card"><div class="center">Registrando tu respuesta…</div></div></div></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://nkmmifyzliiimmtlzeqo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rbW1pZnl6bGlpaW1tdGx6ZXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMjM0MTAsImV4cCI6MjA5NjY5OTQxMH0.QU5JBRH_rbTzUu12oeWmCDmJv6B3UUVKPA5HyeuuzSg';
const sb = supabase.createClient(SB_URL, SB_KEY);
const q = new URLSearchParams(location.search);
const CUIT = q.get('c'), CONV = q.get('v'), RESP = (q.get('r') || '').toLowerCase();

// Íconos dibujados, en blanco y negro: iguales en cualquier equipo.
const ICONO_SI = '<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="29" fill="#16a34a"/><path d="M18 31l8 8 16-17" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICONO_NO = '<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="29" fill="#fff" stroke="#0f1117" stroke-width="2.5"/><path d="M21 21l18 18M39 21L21 39" fill="none" stroke="#0f1117" stroke-width="4.5" stroke-linecap="round"/></svg>';
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function show(html){ document.getElementById('content').innerHTML = '<div class="card">' + html + '</div>'; }

async function go(){
  if (!CUIT || !CONV || (RESP !== 'si' && RESP !== 'no')) {
    show('<div class="center">Link inválido. Pedile el link a la coordinación.</div>'); return;
  }
  try {
    const { data, error } = await sb.rpc('registrar_confirmacion', { p_cuit: CUIT, p_conv_id: CONV, p_respuesta: RESP });
    if (error) throw error;
    if (data && data.ok) {
      const nombre = data.nombre ? (', ' + String(data.nombre).split(' ')[0]) : '';
      const conv = data.convocatoria ? (' para <strong>' + esc(data.convocatoria) + '</strong>') : '';
      if (RESP === 'si') {
        show('<div class="ic">' + ICONO_SI + '</div><div class="t">¡Gracias' + esc(nombre) + '!</div>'
          + '<div class="center">Registramos que <strong>CONFIRMÁS</strong> tu asistencia' + conv + '. ¡Nos vemos!</div>'
          + '<div class="note">¿Te equivocaste? Volvé al mail y tocá el otro botón.</div>');
      } else {
        show('<div class="ic">' + ICONO_NO + '</div><div class="t">Listo' + esc(nombre) + '</div>'
          + '<div class="center">Registramos que <strong>NO vas a asistir</strong>' + conv + '. Gracias por avisar.</div>'
          + '<div class="note">¿Te equivocaste? Volvé al mail y tocá el otro botón.</div>');
      }
      return;
    }
    show('<div class="center">No pudimos registrar tu respuesta (el link puede no corresponder a una convocatoria activa). Escribinos a la coordinación.</div>');
  } catch (e) {
    // Con el detalle: si falla, que se pueda saber qué pasó sin adivinar.
    const det = e && (e.message || e.details) ? ' <span style="color:#9ca3af;font-size:12px">(' + esc((e.code ? '[' + e.code + '] ' : '') + (e.message || '') + (e.details ? ' — ' + e.details : '')) + ')</span>' : '';
    show('<div class="center">Hubo un error al registrar tu respuesta. Probá de nuevo en un rato.' + det + '</div>');
  }
}
go();
</script>
</body>
</html>
