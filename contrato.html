// ── Generación del PDF final (mismo layout que admin.html, con la firma estampada) ──
async function fetchBytes(url) { const r = await fetch(url); return new Uint8Array(await r.arrayBuffer()); }
function dataUrlToBytes(dataUrl) {
  const b64 = dataUrl.split(',')[1] || '';
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
// Corta un texto en líneas que entren en maxWidth, partiendo también palabras
// larguísimas sin espacios (hashes, user agents) para que no se salgan del margen.
function wrapPlain(text, font, size, maxWidth) {
  const piezas = [];
  String(text == null || text === '' ? '—' : text).split(/\s+/).filter(Boolean).forEach(word => {
    let w = word;
    while (font.widthOfTextAtSize(w, size) > maxWidth) {
      let cut = 1;
      while (cut < w.length && font.widthOfTextAtSize(w.slice(0, cut + 1), size) <= maxWidth) cut++;
      piezas.push({ txt: w.slice(0, cut), forzado: true });
      w = w.slice(cut);
    }
    piezas.push({ txt: w, forzado: false });
  });
  const lines = []; let cur = '';
  piezas.forEach(({ txt, forzado }) => {
    if (forzado) { if (cur) { lines.push(cur); cur = ''; } lines.push(txt); return; }
    const test = cur ? cur + ' ' + txt : txt;
    if (font.widthOfTextAtSize(test, size) > maxWidth && cur) { lines.push(cur); cur = txt; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines.length ? lines : ['—'];
}

function fmtGMT(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return String(iso);
  const p = n => String(n).padStart(2, '0');
  let h = d.getUTCHours();
  const ampm = h < 12 ? 'AM' : 'PM';
  h = h % 12 || 12;
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} - ${h}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} ${ampm} GMT`;
}
function fmtAR(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return String(iso);
  try { return d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' hora de Argentina'; }
  catch (_) { return ''; }
}

// Informe de auditoría: última página del PDF firmado, con la trazabilidad
// completa (mismo rol que el "Final Audit Report" de Adobe Sign).
function agregarCertificado(pdfDoc, font, fontBold, rgb, cert) {
  const W = 595.28, H = 841.89, M = 56, maxWidth = W - M * 2;
  let page = pdfDoc.addPage([W, H]);
  let y = H - M;
  const gris = rgb(0.42, 0.45, 0.5), tinta = rgb(0.13, 0.15, 0.18), marca = rgb(0.33, 0.29, 0.72);
  const nuevaPaginaSiHaceFalta = alto => { if (y - alto < M) { page = pdfDoc.addPage([W, H]); y = H - M; } };

  page.drawText('CONTRATO DE TRABAJO A PLAZO FIJO', { x: M, y: y - 16, size: 16, font: fontBold, color: marca });
  y -= 34;
  page.drawText('Informe de auditoría final', { x: M, y, size: 10, font, color: tinta });
  const fechaCorta = (cert.fecha_firma || '').slice(0, 10);
  page.drawText(fechaCorta, { x: W - M - font.widthOfTextAtSize(fechaCorta, 10), y, size: 10, font, color: tinta });
  y -= 16;

  // Panel de resumen
  const filas = [
    ['Creado:', fmtGMT(cert.fecha_creacion)],
    ['Por:', 'Show Business Solutions S.R.L.'],
    ['Firmante:', `${cert.nombre || '—'}${cert.cuil ? ' — CUIL ' + cert.cuil : ''}${cert.email ? ' (' + cert.email + ')' : ''}`],
    ['Estado:', 'Firmado'],
    ['ID de transacción:', cert.transaccion_id || '—'],
    ['Huella SHA-256:', cert.hash_texto || '—']
  ];
  const size = 9, lh = 13;
  let altoPanel = 12;
  const filasCalc = filas.map(([lab, val]) => { const ls = wrapPlain(val, font, size, maxWidth - 130); altoPanel += ls.length * lh; return [lab, ls]; });
  altoPanel += 8;
  nuevaPaginaSiHaceFalta(altoPanel + 20);
  page.drawRectangle({ x: M, y: y - altoPanel, width: maxWidth, height: altoPanel, borderColor: rgb(0.8, 0.82, 0.85), borderWidth: 0.8, color: rgb(0.98, 0.98, 0.99) });
  let yf = y - 16;
  filasCalc.forEach(([lab, ls]) => {
    page.drawText(lab, { x: M + 12, y: yf, size, font: fontBold, color: tinta });
    ls.forEach((ln, i) => page.drawText(ln, { x: M + 122, y: yf - i * lh, size, font, color: gris }));
    yf -= ls.length * lh;
  });
  y -= altoPanel + 26;

  // Historial
  nuevaPaginaSiHaceFalta(30);
  page.drawText('Historial del documento', { x: M, y, size: 12, font: fontBold, color: tinta });
  y -= 20;

  (cert.eventos || []).forEach(ev => {
    const desc = descripcionEvento(ev, cert);
    const lineasDesc = wrapPlain(desc, font, size + 0.5, maxWidth - 14);
    const sub = `${fmtGMT(ev.fecha)} · ${fmtAR(ev.fecha)}${ev.ip ? ' · IP: ' + ev.ip : ''}${ev.tipo === 'firmado' ? ' · Origen de la hora: servidor' : ''}`;
    const lineasSub = wrapPlain(sub, font, size - 0.5, maxWidth - 14);
    const lineasUA = (ev.user_agent && (ev.tipo === 'firmado' || ev.tipo === 'visto')) ? wrapPlain('Dispositivo: ' + ev.user_agent, font, size - 1, maxWidth - 14) : [];
    const alto = (lineasDesc.length * lh) + (lineasSub.length * (lh - 2)) + (lineasUA.length * (lh - 3)) + 10;
    nuevaPaginaSiHaceFalta(alto);
    lineasDesc.forEach(ln => { page.drawText(ln, { x: M + 14, y, size: size + 0.5, font, color: tinta }); y -= lh; });
    lineasSub.forEach(ln => { page.drawText(ln, { x: M + 14, y, size: size - 0.5, font, color: gris }); y -= lh - 2; });
    lineasUA.forEach(ln => { page.drawText(ln, { x: M + 14, y, size: size - 1, font, color: gris }); y -= lh - 3; });
    y -= 10;
  });

  const ultima = (cert.eventos || []).filter(e => e.tipo === 'firmado').slice(-1)[0];
  if (ultima) {
    nuevaPaginaSiHaceFalta(30);
    page.drawText('Acuerdo completado.', { x: M + 14, y, size: size + 0.5, font: fontBold, color: tinta }); y -= lh;
    page.drawText(`${fmtGMT(ultima.fecha)} · ${fmtAR(ultima.fecha)}`, { x: M + 14, y, size: size - 0.5, font, color: gris }); y -= lh + 12;
  }

  // Fundamento legal
  const legal = 'Validez legal: la firma electrónica aplicada sobre este documento constituye una manifestación de voluntad válida conforme a los artículos 286 y 288 del Código Civil y Comercial de la Nación, y al artículo 5 de la Ley N.º 25.506 de Firma Digital. El presente informe, generado automáticamente por el sistema, registra la trazabilidad completa de la operación —envío, apertura, consentimiento expreso y firma, con fecha, hora de servidor, dirección IP y dispositivo— y la huella digital SHA-256 del texto firmado, que permite verificar que su contenido no fue alterado con posterioridad a la firma. Estos elementos constituyen el respaldo probatorio de la autoría e integridad del documento.';
  const lineasLegal = wrapPlain(legal, font, size - 0.5, maxWidth);
  nuevaPaginaSiHaceFalta(lineasLegal.length * (lh - 2) + 20);
  page.drawLine({ start: { x: M, y: y + 6 }, end: { x: W - M, y: y + 6 }, thickness: 0.7, color: rgb(0.8, 0.82, 0.85) });
  y -= 8;
  lineasLegal.forEach(ln => { page.drawText(ln, { x: M, y, size: size - 0.5, font, color: gris }); y -= lh - 2; });
}

function descripcionEvento(ev, cert) {
  const nombre = cert.nombre || 'el firmante';
  const email = cert.email ? ` (${cert.email})` : '';
  switch (ev.tipo) {
    case 'creado': return 'Documento creado por Show Business Solutions S.R.L.';
    case 'enviado': return `Documento enviado por correo electrónico a ${cert.email || 'el firmante'} para su firma`;
    case 'reenviado': return `Documento reenviado por correo electrónico a ${cert.email || 'el firmante'}`;
    case 'visto': return `Documento abierto por ${cert.email || nombre}`;
    case 'consentimiento': return `${nombre} aceptó firmar electrónicamente, con el mismo valor legal que la firma manuscrita`;
    case 'firmado': return `Documento firmado electrónicamente por ${nombre}${email}`;
    default: return ev.tipo;
  }
}

// ── Tipografía del contrato (Poppins, la misma de la plataforma) ──
// Se incrusta en el PDF para que salga con la letra de la empresa. Si los
// archivos no cargaran, se usa Helvetica: preferimos un contrato con otra
// tipografía antes que no poder generarlo.
async function cargarFuentes(pdfDoc) {
  try {
    if (typeof fontkit === 'undefined') throw new Error('falta fontkit');
    pdfDoc.registerFontkit(fontkit);
    const [reg, neg] = await Promise.all([
      fetchBytes(location.origin + '/fuentes/Poppins-Regular.ttf'),
      fetchBytes(location.origin + '/fuentes/Poppins-SemiBold.ttf')
    ]);
    return { normal: await pdfDoc.embedFont(reg, { subset: true }),
             negrita: await pdfDoc.embedFont(neg, { subset: true }) };
  } catch (_) {
    const { StandardFonts } = PDFLib;
    return { normal: await pdfDoc.embedFont(StandardFonts.Helvetica),
             negrita: await pdfDoc.embedFont(StandardFonts.HelveticaBold) };
  }
}

// Imagen por extensión (las firmas pueden ser .png o .jpg).
async function incrustarImagen(pdfDoc, url) {
  const bytes = await fetchBytes(url);
  return /\.jpe?g($|\?)/i.test(url) ? pdfDoc.embedJpg(bytes) : pdfDoc.embedPng(bytes);
}

// Parte un párrafo en líneas y marca en negrita los datos propios del contrato
// (nombre, CUIL, fechas, puesto, monto), igual que el modelo en Word.
function armarLineas(parrafo, fuentes, size, maxWidth, destacar) {
  const marcas = (destacar || [])
    .map(t => String(t == null ? '' : t).trim())
    .filter(t => t.length > 2)
    .sort((a, b) => b.length - a.length);   // primero los más largos, para no cortarlos

  let trozos = [{ t: parrafo, b: false }];
  for (const m of marcas) {
    const nuevos = [];
    for (const tr of trozos) {
      if (tr.b || !tr.t.includes(m)) { nuevos.push(tr); continue; }
      const partes = tr.t.split(m);
      partes.forEach((p, i) => {
        if (p) nuevos.push({ t: p, b: false });
        if (i < partes.length - 1) nuevos.push({ t: m, b: true });
      });
    }
    trozos = nuevos;
  }

  const palabras = [];
  trozos.forEach(tr => tr.t.split(/(\s+)/).forEach(tok => { if (tok) palabras.push({ tok, b: tr.b }); }));

  const lineas = []; let actual = [], ancho = 0;
  palabras.forEach(p => {
    if (/^\s+$/.test(p.tok) && !actual.length) return;
    const f = p.b ? fuentes.negrita : fuentes.normal;
    const w = f.widthOfTextAtSize(p.tok, size);
    if (ancho + w > maxWidth && actual.length) {
      lineas.push(actual); actual = []; ancho = 0;
      if (/^\s+$/.test(p.tok)) return;
    }
    actual.push(p); ancho += w;
  });
  if (actual.length) lineas.push(actual);
  return lineas;
}

// Dibuja una línea. Si va justificada, reparte el sobrante entre los espacios.
function dibujarLinea(page, linea, x, y, size, fuentes, color, maxWidth, justificar) {
  const ancho = linea.reduce((s, p) => s + (p.b ? fuentes.negrita : fuentes.normal).widthOfTextAtSize(p.tok, size), 0);
  const espacios = linea.filter(p => /^\s+$/.test(p.tok)).length;
  let extra = 0;
  if (justificar && espacios > 0) {
    const sobra = (maxWidth - ancho) / espacios;
    if (sobra > 0 && sobra < 5) extra = sobra;   // si sobra demasiado, mejor no estirar
  }
  let cx = x;
  for (const p of linea) {
    const f = p.b ? fuentes.negrita : fuentes.normal;
    const esEspacio = /^\s+$/.test(p.tok);
    if (!esEspacio) page.drawText(p.tok, { x: cx, y, size, font: f, color });
    cx += f.widthOfTextAtSize(p.tok, size) + (esEspacio ? extra : 0);
  }
}

async function generarContratoPDF(texto, opts) {
  opts = opts || {};
  const { PDFDocument, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const fuentes = await cargarFuentes(pdfDoc);

  const W = 595.28, H = 841.89, M = 52;
  const maxWidth = W - M * 2;
  const size = 9, lineH = 12.6, parGap = 7;
  const tinta = rgb(0.11, 0.11, 0.13);
  const azul = rgb(0.17, 0.27, 0.50);
  const TITULO = 'CONTRATO DE TRABAJO A PLAZO FIJO';

  let page = pdfDoc.addPage([W, H]);
  let y = H - M;

  // Encabezado: logo a la izquierda, título centrado y subrayado.
  try {
    if (opts.logoUrl) {
      const img = await incrustarImagen(pdfDoc, opts.logoUrl);
      const d = img.scale(50 / img.width);
      page.drawImage(img, { x: M, y: y - d.height, width: d.width, height: d.height });
    }
  } catch (_) {}
  const titSize = 11;
  const titAncho = fuentes.negrita.widthOfTextAtSize(TITULO, titSize);
  const titX = (W - titAncho) / 2, titY = y - 26;
  page.drawText(TITULO, { x: titX, y: titY, size: titSize, font: fuentes.negrita, color: tinta });
  page.drawLine({ start: { x: titX, y: titY - 2.5 }, end: { x: titX + titAncho, y: titY - 2.5 },
                  thickness: 0.8, color: tinta });
  y -= 74;

  // Cuerpo (la primera línea del texto es el título: no se repite).
  const parrafos = String(texto).split(/\n\n+/)
    .filter((p, i) => !(i === 0 && p.trim().toUpperCase() === TITULO));
  for (const par of parrafos) {
    const lineas = armarLineas(par.trim(), fuentes, size, maxWidth, opts.destacar);
    if (y - (lineas.length * lineH + parGap) < M + 150) { page = pdfDoc.addPage([W, H]); y = H - M; }
    lineas.forEach((ln, i) => {
      dibujarLinea(page, ln, M, y, size, fuentes, tinta, maxWidth, i < lineas.length - 1);
      y -= lineH;
    });
    y -= parGap;
  }

  // Firmas
  if (y < M + 150) { page = pdfDoc.addPage([W, H]); y = H - M; }
  y -= 30;
  const colAncho = (maxWidth - 40) / 2;
  const xEmp = M, xTra = M + colAncho + 40;
  const altoFirma = 52;

  const firmar = async (url, bytes, x) => {
    try {
      const img = url ? await incrustarImagen(pdfDoc, url) : await pdfDoc.embedPng(bytes);
      const esc = Math.min(colAncho / img.width, altoFirma / img.height);
      const d = img.scale(esc);
      page.drawImage(img, { x: x + (colAncho - d.width) / 2, y: y - d.height, width: d.width, height: d.height });
    } catch (_) {}
  };
  if (opts.firmaEmpleadorUrl) await firmar(opts.firmaEmpleadorUrl, null, xEmp);
  if (opts.firmaTrabajadorBytes) await firmar(null, opts.firmaTrabajadorBytes, xTra);

  y -= altoFirma + 2;
  page.drawLine({ start: { x: xEmp, y }, end: { x: xEmp + colAncho, y }, thickness: 0.7, color: rgb(0.45, 0.45, 0.45) });
  page.drawLine({ start: { x: xTra, y }, end: { x: xTra + colAncho, y }, thickness: 0.7, color: rgb(0.45, 0.45, 0.45) });
  y -= 12;
  const centrado = (t, x, size2, f) => x + (colAncho - f.widthOfTextAtSize(t, size2)) / 2;
  page.drawText('EMPLEADOR', { x: centrado('EMPLEADOR', xEmp, 8, fuentes.normal), y, size: 8, font: fuentes.normal, color: rgb(0.35, 0.35, 0.35) });
  const etiqTra = opts.firmaTrabajadorBytes ? 'TRABAJADOR (firmado electrónicamente)' : 'TRABAJADOR';
  page.drawText(etiqTra, { x: centrado(etiqTra, xTra, 8, fuentes.normal), y, size: 8, font: fuentes.normal, color: rgb(0.35, 0.35, 0.35) });

  // Pie: logo y domicilio de la empresa, abajo a la derecha.
  try {
    if (opts.logoUrl) {
      const img = await incrustarImagen(pdfDoc, opts.logoUrl);
      const d = img.scale(24 / img.width);
      page.drawImage(img, { x: W - M - d.width, y: M + 26, width: d.width, height: d.height });
    }
  } catch (_) {}
  const pie = ['Ramallo 4608, CABA', 'BUENOS AIRES, ARGENTINA'];
  let yPie = M + 14;
  pie.forEach(t => {
    const w = fuentes.normal.widthOfTextAtSize(t, 6.5);
    page.drawText(t, { x: W - M - w, y: yPie, size: 6.5, font: fuentes.normal, color: azul });
    yPie -= 8.5;
  });

  // Huella del texto al pie: permite verificar después que el contrato no se alteró.
  const huella = (opts.certificado && opts.certificado.hash_texto) || opts.hashTexto || '';
  if (huella) {
    const nota = (opts.certificado
      ? 'Firmado electrónicamente. El informe de auditoría con la trazabilidad completa de la firma se incluye en la última página de este documento. '
      : '') + 'Huella SHA-256 del texto: ' + huella;
    let yNota = M + 52;
    armarLineas(nota, fuentes, 6.5, maxWidth, []).forEach(ln => {
      dibujarLinea(page, ln, M, yNota, 6.5, fuentes, rgb(0.55, 0.55, 0.55), maxWidth, false);
      yNota -= 9;
    });
  }
  // El informe de auditoría sólo se arma en la página de firma.
  if (opts.certificado && typeof agregarCertificado === 'function') {
    agregarCertificado(pdfDoc, fuentes.normal, fuentes.negrita, rgb, opts.certificado);
  }

  return await pdfDoc.saveAsBase64({ dataUri: false });
}

// La firma va en dos fases: primero el servidor registra consentimiento y firma
// (con su propia hora, IP y user-agent) y devuelve la trazabilidad completa;
// recién después el navegador arma el PDF con ese informe de auditoría adentro
// y lo guarda. Así ningún dato del certificado sale del cliente.
async function firmar() {
  const err = document.getElementById('err'); err.style.display = 'none';
  if (!document.getElementById('consentChk')?.checked) { err.textContent = 'Tenés que aceptar la declaración para poder firmar.'; err.style.display = 'block'; return; }
  if (!signaturePad || signaturePad.isEmpty()) { err.textContent = 'Dibujá tu firma antes de continuar.'; err.style.display = 'block'; return; }
  const btn = document.getElementById('firmarBtn'); btn.disabled = true; btn.textContent = 'Firmando…';
  try {
    const firmaDataUrl = signaturePad.toDataURL('image/png');
    const { data, error } = await sb.rpc('contrato_firmar', { p_token: TOKEN, p_firma_png: firmaDataUrl });
    // Si venció mientras tenía la pantalla abierta, se le explica en vez de
    // tirarle un error suelto.
    if (data && data.ok === false && data.motivo === 'vencido') {
      contrato.vencido = true; contrato.vence_el = data.vence_el;
      renderVencido(); return;
    }
    if (error || !data?.ok) throw new Error(data?.motivo === 'ya_firmado' ? 'Este contrato ya fue firmado.' : 'No se pudo registrar la firma.');

    const pdfBase64 = await generarContratoPDF(data.texto_contrato, {
      logoUrl: location.origin + '/logo-sbs.png',
      firmaEmpleadorUrl: data.firma_empleador_img ? (location.origin + '/' + data.firma_empleador_img) : null,
      firmaTrabajadorBytes: dataUrlToBytes(firmaDataUrl),
      destacar: [data.nombre, data.cuil, data.puesto, data.fecha_inicio, data.fecha_fin, data.monto_letras, data.monto_numero, data.fecha_firma_doc],
      certificado: data
    });
    await sb.rpc('contrato_guardar_pdf', { p_token: TOKEN, p_pdf_firmado: pdfBase64 });

    contrato.estado = 'firmado';
    contrato.fecha_firma = data.fecha_firma;
    contrato.pdf_firmado = pdfBase64;
    renderFirmado();
  } catch (e) {
    err.textContent = e.message || 'Hubo un error. Probá de nuevo.'; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Firmar contrato';
  }
}

init();
</script>
