<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disponibilidad — Recital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f5;color:#1a1a1a;font-size:15px;min-height:100vh}
.page-header{background:#0f1117;padding:26px 24px;text-align:center}
.page-title{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.3px}
.page-sub{font-size:13px;color:#9ca3af;margin-top:5px}
.wrap{max-width:560px;margin:26px auto;padding:0 16px 60px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px}
.conv-name{font-size:18px;font-weight:700;color:#111827}
.conv-meta{font-size:13px;color:#9ca3af;margin-top:4px}
.lbl{display:block;font-size:12px;font-weight:600;color:#374151;margin:18px 0 6px}
.fi{width:100%;padding:12px 14px;border:1.5px solid #d1d5db;border-radius:10px;font-size:16px;outline:none;font-family:inherit}
.fi:focus{border-color:#534AB7;box-shadow:0 0 0 3px rgba(83,74,183,.12)}
.drow{display:flex;align-items:flex-start;gap:12px;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .12s;user-select:none}
.drow:hover{border-color:#c7c9d1}
.drow.on{border-color:#534AB7;background:#f0eeff}
.drow input{width:20px;height:20px;accent-color:#534AB7;pointer-events:none;flex-shrink:0;margin-top:1px}
.dcol{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.drow .d1{font-weight:600;color:#111827;text-transform:capitalize}
.dh{font-size:12px;color:#6b7280;font-weight:500;line-height:1.45;word-break:break-word}
.btn{width:100%;padding:14px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;font-family:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{border-radius:10px;padding:12px 14px;font-size:13px;margin-top:12px;display:none}
.msg.err{background:#fee2e2;color:#991b1b}
.msg.ok{background:#dcfce7;color:#166534}
.center{text-align:center;color:#6b7280;padding:40px 10px}
.link{color:#534AB7;font-weight:600;text-decoration:none}
/* El mes: un bloque por evento, con sus días. */
.ev{margin-top:16px;padding-top:14px;border-top:1px solid #f1f1f4}
.ev-t{font-size:15px;font-weight:700;color:#111827}
.ev-m{font-size:12px;color:#9ca3af;margin:2px 0 8px}
.res{margin:8px 0 0 18px;padding:0}
.res li{margin-top:4px}

/* Los controles de formulario no heredan la tipografia de la pagina: hay que pedirselo. */
button,input,select,textarea,optgroup,option{font-family:inherit}
</style>
</head>
<body>
<div class="page-header">
  <div class="page-title">Disponibilidad</div>
  <div class="page-sub">Marcá qué días podés</div>
</div>
<div class="wrap"><div id="content"><div class="center">Cargando…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://nkmmifyzliiimmtlzeqo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rbW1pZnl6bGlpaW1tdGx6ZXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMjM0MTAsImV4cCI6MjA5NjY5OTQxMH0.QU5JBRH_rbTzUu12oeWmCDmJv6B3UUVKPA5HyeuuzSg';
const sb = supabase.createClient(SB_URL, SB_KEY);
const PARAMS = new URLSearchParams(location.search);
const CONV = PARAMS.get('conv');
// El mes entero (?mes=2026-11, y si se quiere &area=movistar_arena): todos los
// eventos de ese mes con la ronda abierta, en una sola página.
const MES = PARAMS.get('mes'), AREA = PARAMS.get('area') || '';
const AREA_LABEL = { movistar_arena: 'Movistar Arena', externos: 'Externos', espana: 'España', ambas: 'Ambas áreas' };
let conv = null, slots = [];
let eventosMes = [], prevPorConv = {}, prevCuil = '';

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtFecha(f){ try { return new Date(f+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'}); } catch(e){ return f; } }
function show(html){ document.getElementById('content').innerHTML = html; }
// Turnos (fecha + horario, la misma fecha puede repetirse). Fallback a fechas viejas.
function slotsDe(c){
  if (Array.isArray(c.turnos) && c.turnos.length) return c.turnos.map(t => ({ id: t.id, fecha: t.fecha, horario: t.horario || c.horario || '' })).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const fs = String(c.fecha||'').split(',').map(f=>f.trim()).filter(Boolean).sort();
  const hpf = (c.horarios_por_fecha && typeof c.horarios_por_fecha==='object') ? c.horarios_por_fecha : {};
  return fs.map(f => ({ id: f, fecha: f, horario: hpf[f] || c.horario || '' }));
}

async function init(){
  if (MES) return initMes();
  if (!CONV) { show('<div class="card"><div class="center">Link inválido. Pedile el link a la coordinación.</div></div>'); return; }
  const { data, error } = await sb.from('convocatorias').select('id,nombre,fecha,area,disp_abierta,horario,venue,horarios_por_fecha,turnos').eq('id', CONV).single();
  if (error || !data) { show('<div class="card"><div class="center">No encontramos esta convocatoria.</div></div>'); return; }
  conv = data;
  if (!conv.disp_abierta) { show(`<div class="card"><div class="conv-name">${esc(conv.nombre)}</div><div class="center">La ronda de disponibilidad no está abierta en este momento.</div></div>`); return; }
  slots = slotsDe(conv);
  renderForm();
}

function renderForm(){
  const filas = slots.length
    ? slots.map(s => `<label class="drow" data-f="${s.id}" onclick="toggleRow(this)"><input type="checkbox"><span class="dcol"><span class="d1">${fmtFecha(s.fecha)}</span>${s.horario ? `<span class="dh">🕒 ${esc(s.horario)}</span>` : ''}</span></label>`).join('')
    : '<div class="center">Esta convocatoria no tiene fechas cargadas.</div>';
  show(`<div class="card">
    <div class="conv-name">${esc(conv.nombre)}</div>
    <div class="conv-meta">${AREA_LABEL[conv.area]||conv.area||''}${conv.horario?` &nbsp;·&nbsp; 🕒 ${esc(conv.horario)}`:''}${conv.venue?` &nbsp;·&nbsp; 📍 ${esc(conv.venue)}`:''}</div>
    <label class="lbl">Tu CUIL (11 dígitos)</label>
    <input class="fi" id="cuil" inputmode="numeric" maxlength="11" placeholder="Sin guiones" oninput="onCuil(this)">
    <div class="msg err" id="regWarn" style="margin-top:8px"></div>
    <label class="lbl">¿Qué días podés? (marcá los que sí)</label>
    ${filas}
    <button class="btn" id="enviarBtn" onclick="enviar()">Enviar disponibilidad</button>
    <div class="msg err" id="err"></div>
    <div class="msg ok" id="ok"></div>
  </div>`);
}

function toggleRow(el){ const cb = el.querySelector('input'); cb.checked = !cb.checked; el.classList.toggle('on', cb.checked); }
function selectedFechas(){ return [...document.querySelectorAll('.drow')].filter(r => r.querySelector('input').checked).map(r => r.dataset.f); }

let prefillTimer = null;
function onCuil(inp){
  inp.value = inp.value.replace(/\D/g,'');
  clearTimeout(prefillTimer);
  const w = document.getElementById('regWarn'); if (w && inp.value.length < 11) w.style.display = 'none';
  if (inp.value.length === 11) prefillTimer = setTimeout(() => { (MES ? prefillMes : prefill)(); checkReg(); }, 250);
}
async function checkReg(){
  const cuil = document.getElementById('cuil').value.replace(/\D/g,'');
  const w = document.getElementById('regWarn'); if (!w || cuil.length !== 11) return;
  try {
    const { data } = await sb.rpc('esta_registrado', { p_cuit: cuil });
    if (data === true) { w.style.display = 'none'; }
    else { w.innerHTML = 'Este CUIL no está registrado. Para poder enviar tu disponibilidad, <a class="link" href="candidato.html">registrate primero acá</a>.'; w.style.display = 'block'; }
  } catch(_) {}
}
async function prefill(){
  const cuil = document.getElementById('cuil').value.replace(/\D/g,'');
  if (cuil.length !== 11) return;
  try {
    const { data } = await sb.rpc('mi_disponibilidad', { p_cuit: cuil, p_conv_id: CONV });
    const prev = Array.isArray(data) ? data : [];
    document.querySelectorAll('.drow').forEach(r => { const on = prev.includes(r.dataset.f); r.querySelector('input').checked = on; r.classList.toggle('on', on); });
  } catch(_) {}
}

async function enviar(){
  const err = document.getElementById('err'), ok = document.getElementById('ok');
  err.style.display = 'none'; ok.style.display = 'none';
  const cuil = document.getElementById('cuil').value.replace(/\D/g,'');
  if (cuil.length !== 11) { err.textContent = 'Ingresá tu CUIL (11 dígitos).'; err.style.display = 'block'; return; }
  const btn = document.getElementById('enviarBtn'); btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const { data, error } = await sb.rpc('guardar_disponibilidad', { p_cuit: cuil, p_conv_id: CONV, p_fechas: selectedFechas() });
    if (error) throw error;
    if (data && data.ok) {
      const n = selectedFechas().length;
      show(`<div class="card"><div style="font-size:46px;text-align:center;margin-bottom:10px">✅</div>
        <div class="conv-name" style="text-align:center">¡Gracias${data.nombre?', '+esc(String(data.nombre).split(' ')[0]):''}!</div>
        <div class="center" style="padding:12px 0 0">Registramos tu disponibilidad para <strong>${esc(conv.nombre)}</strong>${n?` (${n} fecha/s)`:' (sin fechas marcadas)'}.<br>Si te seleccionan, te vamos a enviar la confirmación.</div>
        <button class="btn" onclick="init()">Modificar mi respuesta</button></div>`);
      return;
    }
    if (data && data.motivo === 'no_registrado') {
      err.innerHTML = 'No encontramos tu registro con ese CUIL. Primero tenés que <a class="link" href="candidato.html">registrarte acá</a>.';
      err.style.display = 'block';
    } else if (data && data.motivo === 'convocado') {
      // Ya está convocada otro día que marcó: la base no guardó nada. Se le
      // dice cuáles son para que las desmarque y vuelva a enviar.
      const lista = (data.choques || []).map(ch => `<li><strong>${esc(fmtFecha(ch.fecha))}</strong> — ya estás convocado/a en <strong>${esc(ch.conv)}</strong></li>`).join('');
      err.innerHTML = `No se guardó: hay fecha(s) en las que ya estás convocado/a para otro servicio.<ul style="margin:8px 0 0 18px;padding:0">${lista}</ul><div style="margin-top:8px">Desmarcá esa(s) fecha(s) y volvé a enviar.</div>`;
      err.style.display = 'block';
    } else if (data && data.motivo === 'cerrada') {
      err.textContent = 'La ronda de disponibilidad se cerró.'; err.style.display = 'block';
    } else {
      err.textContent = 'No se pudo guardar. Revisá el CUIL e intentá de nuevo.'; err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Enviar disponibilidad';
  } catch (e) {
    err.textContent = 'Hubo un error. Probá de nuevo.'; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Enviar disponibilidad';
  }
}

// ── EL MES ENTERO ──
function nombreMes(m){ try { return new Date(m + '-01T00:00:00').toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }); } catch(e){ return m; } }
async function initMes(){
  if (!/^\d{4}-\d{2}$/.test(MES)) { show('<div class="card"><div class="center">Link inválido. Pedile el link a la coordinación.</div></div>'); return; }
  document.querySelector('.page-sub').textContent = 'Marcá qué días podés en ' + nombreMes(MES);
  const { data, error } = await sb.from('convocatorias').select('id,nombre,fecha,area,disp_abierta,horario,venue,horarios_por_fecha,turnos').eq('disp_abierta', true);
  if (error) { show('<div class="card"><div class="center">No se pudieron traer los eventos. Probá de nuevo en un rato.</div></div>'); return; }
  // Sólo los días de ese mes de cada evento (uno que cruza de mes muestra los suyos de este).
  // Sin área son las dos de Argentina (España tiene su propio link).
  eventosMes = (data || []).filter(c => AREA ? c.area === AREA || c.area === 'ambas' : c.area !== 'espana')
    .map(c => ({ conv: c, slots: slotsDe(c).filter(s => String(s.fecha || '').startsWith(MES)) }))
    .filter(x => x.slots.length)
    .sort((a, b) => a.slots[0].fecha.localeCompare(b.slots[0].fecha) || String(a.conv.nombre).localeCompare(String(b.conv.nombre)));
  if (!eventosMes.length) { show(`<div class="card"><div class="conv-name">Disponibilidad de ${esc(nombreMes(MES))}</div><div class="center">Todavía no hay eventos abiertos para este mes. Volvé a mirar más adelante.</div></div>`); return; }
  prevPorConv = {}; prevCuil = '';
  renderMes();
}
function renderMes(){
  const bloques = eventosMes.map(ev => `<div class="ev">
      <div class="ev-t">${esc(ev.conv.nombre)}</div>
      <div class="ev-m">${[AREA ? '' : (AREA_LABEL[ev.conv.area] || ''), ev.conv.venue ? '📍 ' + esc(ev.conv.venue) : ''].filter(Boolean).join(' · ')}</div>
      ${ev.slots.map(s => `<label class="drow" data-c="${esc(ev.conv.id)}" data-f="${esc(s.id)}" onclick="toggleRow(this)"><input type="checkbox"><span class="dcol"><span class="d1">${fmtFecha(s.fecha)}</span>${s.horario ? `<span class="dh">🕒 ${esc(s.horario)}</span>` : ''}</span></label>`).join('')}
    </div>`).join('');
  show(`<div class="card">
    <div class="conv-name">Disponibilidad de ${esc(nombreMes(MES))}</div>
    <div class="conv-meta">${eventosMes.length} evento${eventosMes.length === 1 ? '' : 's'}${AREA ? ' · ' + esc(AREA_LABEL[AREA] || AREA) : ''}</div>
    <label class="lbl">Tu CUIL (11 dígitos)</label>
    <input class="fi" id="cuil" inputmode="numeric" maxlength="11" placeholder="Sin guiones" oninput="onCuil(this)">
    <div class="msg err" id="regWarn" style="margin-top:8px"></div>
    <label class="lbl">¿Qué días podés? (marcá los que sí, de todos los eventos que quieras)</label>
    ${bloques}
    <button class="btn" id="enviarBtn" onclick="enviarMes()">Enviar disponibilidad</button>
    <div class="msg err" id="err"></div>
    <div class="msg ok" id="ok"></div>
  </div>`);
}
// Lo que ya había marcado en cada evento (para mostrarlo y para no borrarle días de otros meses).
async function cargarPrevMes(cuil){
  const pares = await Promise.all(eventosMes.map(async ev => {
    try { const { data } = await sb.rpc('mi_disponibilidad', { p_cuit: cuil, p_conv_id: ev.conv.id }); return [ev.conv.id, Array.isArray(data) ? data : []]; }
    catch(_) { return [ev.conv.id, []]; }
  }));
  prevPorConv = Object.fromEntries(pares); prevCuil = cuil;
}
async function prefillMes(){
  const cuil = document.getElementById('cuil').value.replace(/\D/g,'');
  if (cuil.length !== 11) return;
  await cargarPrevMes(cuil);
  document.querySelectorAll('.drow').forEach(r => { const on = (prevPorConv[r.dataset.c] || []).includes(r.dataset.f); r.querySelector('input').checked = on; r.classList.toggle('on', on); });
}
async function enviarMes(){
  const err = document.getElementById('err'), ok = document.getElementById('ok');
  err.style.display = 'none'; ok.style.display = 'none';
  const cuil = document.getElementById('cuil').value.replace(/\D/g,'');
  if (cuil.length !== 11) { err.textContent = 'Ingresá tu CUIL (11 dígitos).'; err.style.display = 'block'; return; }
  const btn = document.getElementById('enviarBtn'); btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    if (prevCuil !== cuil) await cargarPrevMes(cuil);
    const marcados = {}; eventosMes.forEach(ev => { marcados[ev.conv.id] = []; });
    document.querySelectorAll('.drow').forEach(r => { if (r.querySelector('input').checked) marcados[r.dataset.c].push(r.dataset.f); });
    // Se manda cada evento que tiene algo marcado ahora o lo tenía antes; a los
    // días de otros meses de ese mismo evento no se los toca.
    const aMandar = eventosMes.filter(ev => marcados[ev.conv.id].length || (prevPorConv[ev.conv.id] || []).length);
    if (!aMandar.length) { err.textContent = 'Marcá al menos un día.'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Enviar disponibilidad'; return; }
    const guardados = [], choques = [], cerrados = [], fallidos = [];
    let nombre = '';
    for (const ev of aMandar) {
      const deEsteMes = new Set(ev.slots.map(s => s.id));
      const fechas = (prevPorConv[ev.conv.id] || []).filter(f => !deEsteMes.has(f)).concat(marcados[ev.conv.id]);
      const { data, error } = await sb.rpc('guardar_disponibilidad', { p_cuit: cuil, p_conv_id: ev.conv.id, p_fechas: fechas });
      if (error) { fallidos.push(ev.conv.nombre); continue; }
      if (data && data.ok) { guardados.push({ nombre: ev.conv.nombre, n: marcados[ev.conv.id].length }); nombre = nombre || data.nombre || ''; continue; }
      if (data && data.motivo === 'no_registrado') {
        err.innerHTML = 'No encontramos tu registro con ese CUIL. Primero tenés que <a class="link" href="candidato.html">registrarte acá</a>.';
        err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Enviar disponibilidad'; return;
      }
      if (data && data.motivo === 'convocado') (data.choques || []).forEach(ch => choques.push({ evento: ev.conv.nombre, fecha: ch.fecha, conv: ch.conv }));
      else if (data && data.motivo === 'cerrada') cerrados.push(ev.conv.nombre);
      else fallidos.push(ev.conv.nombre);
    }
    prevCuil = '';   // la próxima vez se vuelve a leer lo guardado
    if (!choques.length && !cerrados.length && !fallidos.length) {
      show(`<div class="card"><div style="font-size:46px;text-align:center;margin-bottom:10px">✅</div>
        <div class="conv-name" style="text-align:center">¡Gracias${nombre ? ', ' + esc(String(nombre).split(' ')[0]) : ''}!</div>
        <div class="center" style="padding:12px 0 0">Registramos tu disponibilidad de ${esc(nombreMes(MES))}:</div>
        <ul class="res">${guardados.map(g => `<li><strong>${esc(g.nombre)}</strong>: ${g.n ? g.n + ' día' + (g.n === 1 ? '' : 's') : 'ningún día'}</li>`).join('')}</ul>
        <div class="center" style="padding:12px 0 0">Si te seleccionan, te vamos a enviar la confirmación.</div>
        <button class="btn" onclick="initMes()">Modificar mi respuesta</button></div>`);
      return;
    }
    // Algo no se guardó: se dice qué, y lo demás quedó guardado.
    let h = '';
    if (guardados.length) h += `<div>Se guardó: ${guardados.map(g => '<strong>' + esc(g.nombre) + '</strong>').join(', ')}.</div>`;
    if (choques.length) h += `<div style="margin-top:8px">No se guardó lo de abajo: ya estás convocado/a esos días para otro servicio. Desmarcalos y volvé a enviar.</div><ul class="res">${choques.map(ch => `<li><strong>${esc(fmtFecha(ch.fecha))}</strong> (${esc(ch.evento)}) — ya estás en <strong>${esc(ch.conv)}</strong></li>`).join('')}</ul>`;
    if (cerrados.length) h += `<div style="margin-top:8px">Ya se cerró la ronda de: ${cerrados.map(esc).join(', ')}.</div>`;
    if (fallidos.length) h += `<div style="margin-top:8px">No se pudo guardar: ${fallidos.map(esc).join(', ')}. Probá de nuevo.</div>`;
    err.innerHTML = h; err.style.display = 'block';
  } catch (e) {
    err.textContent = 'Hubo un error. Probá de nuevo.'; err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Enviar disponibilidad';
}

init();
</script>
</body>
</html>
