<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de vacaciones — Show Business Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* La solicitud de vacaciones del personal corporativo (24-nov), con el template de SBS (el Word de la marca): arriba,
   en blanco, el logo "SBS Show Business Solutions" con show-bs.com y la línea gris, el título en mayúsculas y los pasos
   del circuito; abajo, cada parte en su tarjeta. Poppins, negro sobre blanco y grises. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f3f3;color:#1a1a1a;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column}   /* la leyenda de RR. HH., siempre abajo de todo (25-nov) */
.ancho{max-width:760px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e3e3}
.cab{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 12px;border-bottom:1.5px solid #9a9a9a}
.cab img{height:26px;width:auto;display:block}
.cab span{font-weight:600;font-size:13px;color:#2b2b2b}
h1{font-size:27px;line-height:1.08;font-weight:700;text-transform:uppercase;letter-spacing:-.2px;margin:24px 0 2px}
.sub{font-size:14px;color:#4a4a4a}
/* Los pasos del circuito */
.pasos{display:flex;margin:20px 0 18px;padding:0;list-style:none}
.pasos li{flex:1;position:relative;text-align:center;font-size:11.5px;color:#8a8a8a;font-weight:500;line-height:1.25;padding:0 2px}
.pasos li::before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:2px;background:#dcdcdc;z-index:0}
.pasos li:first-child::before{display:none}
.pasos i{position:relative;z-index:1;display:grid;place-items:center;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:#fff;border:2px solid #cfcfcf;font-style:normal;font-weight:700;font-size:12px;color:#8a8a8a}
.pasos li.hecho{color:#1a1a1a}.pasos li.hecho i{background:#1a1a1a;border-color:#1a1a1a;color:#fff}.pasos li.hecho::before{background:#1a1a1a}
.pasos li.ahora{color:#1a1a1a;font-weight:700}.pasos li.ahora i{border-color:#1a1a1a;color:#1a1a1a;box-shadow:0 0 0 4px rgba(26,26,26,.08)}.pasos li.ahora::before{background:#1a1a1a}
.pasos li.salteado{color:#a0a0a0}.pasos li.salteado i{border-style:dashed}
.pasos li.no{color:#8e1b12}.pasos li.no i{background:#8e1b12;border-color:#8e1b12;color:#fff}
/* Las tarjetas */
main{padding:6px 0 26px;flex:1 0 auto;width:100%}
.card{background:#fff;border:1px solid #e3e3e3;border-radius:14px;padding:18px;margin-top:12px}
.card-t{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.card-t .num{flex:0 0 22px;height:22px;border-radius:50%;background:#1a1a1a;color:#fff;display:grid;place-items:center;font-size:11px;letter-spacing:0}
.card-t small{margin-left:auto;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:#6b6b6b}
.meta{font-size:12.5px;color:#6b6b6b;margin-top:10px}
.meta b{color:#1a1a1a;font-weight:600}
.txt{font-size:14px;color:#2b2b2b}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px 12px}
.campo label{display:block;font-size:12px;font-weight:600;color:#4a4a4a;margin-bottom:4px}
.in{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid #d4d4d4;border-radius:9px;background:#fff;font-size:14.5px}
.in:focus{outline:none;border-color:#1a1a1a}
/* Los tramos */
.tramo{display:grid;grid-template-columns:86px 1fr 1fr 64px;gap:8px 10px;align-items:end;padding:10px 0;border-top:1px solid #efefef}
.tramo:first-of-type{border-top:0;padding-top:0}
.tramo>*{min-width:0}.tramo input[type=date]{min-width:0;padding-left:10px;padding-right:6px}
.tramo .n{font-weight:600;font-size:13.5px;padding-bottom:12px}
.tramo .n small{display:block;font-weight:400;font-size:11.5px;color:#8a8a8a}
.tramo .d{height:44px;border-radius:9px;background:#f2f2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tramo .d b{font-size:17px}.tramo .d span{font-size:10px;color:#6b6b6b;margin-top:2px}
.tramo .av{grid-column:2 / -1;font-size:12.5px;margin-top:-2px}
.tramo .fer{grid-column:2 / -1;display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.tramo .fer input{width:17px;height:17px;accent-color:#1a1a1a}
.ok{color:#4a4a4a}.mal{color:#b42318;font-weight:600}.ojo{color:#8a6100}
.resumen{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;padding-top:12px;border-top:1px solid #efefef;font-size:13px}
.resumen .tot{font-size:14px}.resumen .tot b{font-size:17px}
.lnk{background:none;border:0;padding:4px 0;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:#1a1a1a}
.cond{margin-top:12px;border-radius:10px;background:#f7f7f7;padding:10px 12px;font-size:12.5px;color:#4a4a4a}
.cond summary{cursor:pointer;font-weight:600;color:#1a1a1a;list-style:none}
.cond summary::-webkit-details-marker{display:none}
.cond summary::after{content:" · ver todas";font-weight:500;color:#6b6b6b;text-decoration:underline;text-underline-offset:2px}
.cond[open] summary::after{content:" · ocultar"}
.cond ul{margin:8px 0 2px;padding-left:18px}.cond li+li{margin-top:3px}
/* La firma */
.firma-caja{border:1.5px dashed #c4c4c4;border-radius:10px;position:relative;background:#fff}
.firma-caja canvas{width:100%;height:150px;display:block;touch-action:none;border-radius:10px}
.firma-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b5b5b5;font-size:13px;pointer-events:none}
.firma-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;font-size:12.5px;color:#6b6b6b}
.btn{display:block;width:100%;min-height:50px;margin-top:14px;border:0;border-radius:10px;background:#1a1a1a;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#fff;color:#1a1a1a;border:1.5px solid #d4d4d4}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.msg{display:none;margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13.5px}
.msg.on{display:block}.msg.err{background:#fdecea;color:#8e1b12}
.codigo{font-size:26px;letter-spacing:10px;text-align:center;font-weight:600}
/* Mis solicitudes */
.solic{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #efefef}
.solic:first-child{border-top:0;padding-top:0}
.solic .t{flex:1;min-width:0}.solic .t b{display:block;font-size:14px}.solic .t small{display:block;font-size:12px;color:#6b6b6b}
.estado{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:#f0f0f0;color:#2b2b2b;white-space:nowrap}
.estado.aprobada{background:#1a1a1a;color:#fff}.estado.rechazada{background:#fdecea;color:#8e1b12}.estado.cancelada{background:#fff;color:#8a8a8a;border:1px solid #d9d9d9}
/* Modificar o cancelar */
.aviso{border-radius:12px;background:#fff;border:1px solid #e3e3e3;border-left:4px solid #1a1a1a;padding:12px 14px;font-size:13.5px;color:#2b2b2b;margin-top:12px}
.aviso b{color:#1a1a1a}
.aviso.cancel{border-left-color:#9a9a9a}
.btn.peligro{background:#fff;color:#8e1b12;border:1.5px solid #e8c4c0}
.btn.rojo{background:#8e1b12}
/* Ver */
.datos{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.datos div small{display:block;font-size:11.5px;color:#6b6b6b}.datos div b{font-weight:500;font-size:14px;overflow-wrap:anywhere}
.fila-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #efefef;font-size:14px}
.fila-t:first-of-type{border-top:0;padding-top:0}
.fila-t span{color:#6b6b6b;font-size:12.5px;flex:0 0 70px}.fila-t div{flex:1}.fila-t em{font-style:normal;font-weight:700;white-space:nowrap}
.firmas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.firma{border:1px solid #e6e6e6;border-radius:10px;padding:10px 11px;font-size:12px;color:#4a4a4a}
.firma b{display:block;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:#1a1a1a;margin-bottom:3px}
.firma img{display:block;max-width:100%;height:50px;object-fit:contain;margin:4px 0}
.firma .pend{color:#9a9a9a;font-style:italic;padding:16px 0}
.decision{display:flex;gap:10px}
.decision button{flex:1;min-height:48px;border:1.5px solid #d4d4d4;border-radius:10px;background:#fff;font-weight:600;cursor:pointer}
.decision button.on{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.decision button.no.on{background:#8e1b12;border-color:#8e1b12}
.traza summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.traza summary::-webkit-details-marker{display:none}
.traza summary::after{content:"Ver";margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;text-decoration:underline;text-underline-offset:3px}
.traza[open] summary::after{content:"Ocultar"}
.ev{display:grid;grid-template-columns:118px 1fr;gap:2px 12px;padding:9px 0;border-top:1px solid #efefef;font-size:12.5px}
.ev:first-of-type{margin-top:10px}
.ev time{color:#6b6b6b;font-variant-numeric:tabular-nums}
.ev b{font-weight:600}.ev small{grid-column:2;color:#8a8a8a;font-size:11.5px;overflow-wrap:anywhere}
.huella{margin-top:10px;font-size:11.5px;color:#6b6b6b;overflow-wrap:anywhere}
.centro{text-align:center;padding:10px 0 4px}
.centro .ic{width:46px;height:46px;border-radius:50%;background:#1a1a1a;color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:22px}
.centro b{display:block;font-size:17px;margin-bottom:4px}
.pie{text-align:center;font-size:11px;color:#8a8a8a;padding:0 16px 26px;flex-shrink:0}
.oculto{display:none!important}
@media(max-width:620px){h1{font-size:23px;margin-top:20px}.grid2{grid-template-columns:1fr}.firmas{grid-template-columns:1fr}.datos{grid-template-columns:1fr 1fr}
  .tramo{grid-template-columns:1fr 1fr 58px}.tramo .n{grid-column:1 / -1;padding-bottom:0}.tramo .av,.tramo .fer{grid-column:1 / -1}
  .pasos li{font-size:10px}.card{padding:15px}.ev{grid-template-columns:1fr}.ev small{grid-column:1}}
</style>
</head>
<body>
<div class="top"><div class="ancho">
  <header class="cab"><img src="logo-sbs-horizontal.png" alt="SBS Show Business Solutions"><span>show-bs.com</span></header>
  <h1>Solicitud de vacaciones</h1>
  <div class="sub" id="sub">Temporada 2026/2027 · Recursos Humanos</div>
  <ol class="pasos" id="pasos"></ol>
</div></div>
<main class="ancho" id="vista"><div class="card"><div class="txt">Cargando…</div></div></main>
<footer class="pie">Proyecto llevado a cabo por la Gerencia de RR. HH.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script>
// ── LA SOLICITUD DE VACACIONES (24-nov) ─────────────────────────
// Para el personal corporativo (interno, nada que ver con las convocatorias). El link va en un newsletter.
//  · Sin link: entrar con el mail (llega un código) → mis solicitudes → una nueva: datos, fechas, firma → enviar.
//    RR. HH. la deriva desde el panel al jefe que corresponde.
//  · Con link (?t=): el jefe o RR. HH. la aprueban (o no) y firman; la persona y quien ya firmó, la ven.
// Cada paso queda registrado (la trazabilidad, como en los contratos) y va en el informe de auditoría del PDF.
const SB_URL = 'https://nkmmifyzliiimmtlzeqo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rbW1pZnl6bGlpaW1tdGx6ZXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMjM0MTAsImV4cCI6MjA5NjY5OTQxMH0.QU5JBRH_rbTzUu12oeWmCDmJv6B3UUVKPA5HyeuuzSg';
const sb = supabase.createClient(SB_URL, SB_KEY);
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const dos = n => String(n).padStart(2, '0');
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()); };
const fechaDMA = f => { const [a, m, d] = String(f).slice(0, 10).split('-'); return d && m && a ? d + '/' + m + '/' + a : ''; };
const fechaLarga = f => { const d = new Date(String(f).slice(0, 10) + 'T12:00:00'); return isNaN(d) ? '' : DIAS[d.getDay()] + ' ' + fechaDMA(f); };
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5) + 1;
const diaSemana = f => new Date(f + 'T12:00:00').getDay();
const fechaHora = iso => { const d = new Date(iso); return isNaN(d) ? '' : dos(d.getDate()) + '/' + dos(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + dos(d.getHours()) + ':' + dos(d.getMinutes()); };
const ESTADOS = { nueva: 'Esperando que RR. HH. la derive', jefe: 'Esperando al jefe directo', rrhh: 'Esperando a RR. HH.', aprobada: 'Aprobada', rechazada: 'No aprobada', cancelada: 'Cancelada' };
const CONDICIONES = ['Te corresponden 14 días corridos. Si ya usaste días a cuenta, RR. HH. te confirma el saldo.',
  'Cada tramo dura 7 días corridos o más y empieza un lunes o el primer día hábil de la semana.',
  'Pedilas con al menos 30 días de anticipación.',
  'Las aprueba tu jefe directo y/o RR. HH. No se aprueban fechas con eventos de tu área.',
  'Plus vacacional + adelanto de vacaciones: las vacaciones se cobran antes de salir.'];
const PASOS_TIPO = { creada: 'Firmó la solicitud', aviso: 'Mail enviado', derivada: 'Derivada', abierta: 'Abrió el link', firmada: 'Firmó', pdf: 'PDF guardado', reenviada: 'Link reenviado', cancelada: 'Cancelada', reemplazada: 'Modificada' };
const fechaDM = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.getDate() + '/' + (d.getMonth() + 1); };
function vista(html) { $('vista').innerHTML = html; scrollTo(0, 0); }
function msg(id, texto) { const m = $(id); if (!m) return; m.textContent = texto || ''; m.className = 'msg' + (texto ? ' on err' : ''); }
async function api(cuerpo) {
  const r = await fetch('/api/mis-datos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
  const d = await r.json().catch(() => ({})); return r.ok ? d : Object.assign({ ok: false }, d);
}
// Los pasos del circuito, arriba: hecho, ahora, salteado (sin jefe) o no aprobada.
function pasos(estado, conJefe) {
  const N = ['Solicitud', 'Derivación', 'Jefe directo', 'RR. HH.', 'PDF firmado'];
  const i = { form: 0, nueva: 1, jefe: 2, rrhh: 3, aprobada: 5, rechazada: 5 }[estado];
  $('pasos').innerHTML = estado && i !== undefined ? N.map((n, k) => {
    let cl = k < i ? 'hecho' : k === i ? 'ahora' : '';
    if (k === 2 && conJefe === false && i > 2) cl = 'salteado';
    if (estado === 'rechazada' && k === 4) { cl = 'no'; n = 'No aprobada'; }
    return `<li class="${cl}"><i>${cl === 'hecho' ? '✓' : cl === 'no' ? '✕' : cl === 'salteado' ? '–' : k + 1}</i>${k === 2 && cl === 'salteado' ? 'Sin jefe' : n}</li>`;
  }).join('') : '';
}
// La sesión de quien entró con su mail (3 horas), en este aparato.
let ses = null;
try { ses = JSON.parse(sessionStorage.getItem('vacSesion') || 'null'); } catch (_) { ses = null; }
const guardarSes = s => { ses = s; try { sessionStorage.setItem('vacSesion', JSON.stringify(s)); } catch (_) {} };

// ── ENTRAR CON EL MAIL ──────────────────────────────────────────
function pantallaEntrar(mail) {
  pasos('');
  vista(`<div class="card"><div class="card-t">Entrá con tu mail</div>
    <div class="txt">Te mandamos un código para entrar. Con eso ves tus solicitudes y podés hacer una nueva.</div>
    <div class="campo" style="margin-top:14px"><label for="mail">Tu mail</label><input class="in" id="mail" type="email" autocomplete="email" placeholder="nombre@show-bs.com" value="${esc(mail || '')}" onkeydown="if(event.key==='Enter')pedirCodigo()"></div>
    <button class="btn" id="btnCod" onclick="pedirCodigo()">Mandame el código</button>
    <div class="msg" id="mEntrar"></div></div>`);
}
async function pedirCodigo() {
  const mail = $('mail').value.trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { msg('mEntrar', 'Revisá tu mail.'); return; }
  $('btnCod').disabled = true; $('btnCod').textContent = 'Mandando…';
  const r = await api({ vacaciones: 'codigo', email: mail });
  if (!r.ok) { $('btnCod').disabled = false; $('btnCod').textContent = 'Mandame el código'; msg('mEntrar', r.error || 'No se pudo mandar el código.'); return; }
  vista(`<div class="card"><div class="card-t">Tu código</div>
    <div class="txt">Te lo mandamos a <b>${esc(mail)}</b> (si no lo ves, buscalo en el correo no deseado). Vence en 30 minutos.</div>
    <div class="campo" style="margin-top:14px"><input class="in codigo" id="cod" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="······" onkeydown="if(event.key==='Enter')entrar()"></div>
    <button class="btn" id="btnEntrar" onclick="entrar()">Entrar</button>
    <div class="msg" id="mEntrar"></div>
    <div style="text-align:center;margin-top:10px"><button class="lnk" onclick="pantallaEntrar('${esc(mail)}')">Usar otro mail o pedir otro código</button></div></div>`);
  pantallaEntrar.mail = mail; setTimeout(() => { const c = $('cod'); if (c) c.focus(); }, 50);
}
async function entrar() {
  const cod = $('cod').value.replace(/\D/g, ''); if (cod.length !== 6) { msg('mEntrar', 'Son 6 números.'); return; }
  $('btnEntrar').disabled = true;
  const { data, error } = await sb.rpc('vacaciones_entrar', { p_email: pantallaEntrar.mail, p_codigo: cod });
  $('btnEntrar').disabled = false;
  if (error || !data || !data.ok) { msg('mEntrar', (data && data.error) || 'No pudimos verificar el código. Probá de nuevo.'); return; }
  guardarSes({ sesion: data.sesion, email: data.email }); misSolicitudes(data.mias);
}

// ── MIS SOLICITUDES ─────────────────────────────────────────────
async function misSolicitudes(mias) {
  if (!mias) {
    const { data } = await sb.rpc('vacaciones_mias', { p_sesion: ses.sesion });
    if (!data || !data.ok) { guardarSes(null); pantallaEntrar(); return; }
    mias = data.mias;
  }
  if (!mias.length) { nuevaSolicitud(); return; }
  pasos('');
  vista(`<div class="card"><div class="card-t">Tus solicitudes<small>${esc(ses.email)}</small></div>
    ${mias.map(s => `<div class="solic"><div class="t"><b>${(s.datos.tramos || []).map(t => fechaDMA(t.desde) + ' al ' + fechaDMA(t.hasta)).join(' · ')}</b><small>${s.datos.total} días corridos · pedida el ${fechaDMA(s.creada)}</small></div>
      <span class="estado ${s.estado}">${ESTADOS[s.estado]}</span><button class="lnk" onclick="verMia('${s.id}')">Ver</button></div>`).join('')}
    <button class="btn" onclick="nuevaSolicitud.reemplaza=null;nuevaSolicitud()">Nueva solicitud</button>
    <div style="text-align:center;margin-top:8px"><button class="lnk" onclick="salir()">Salir</button></div></div>`);
}

async function bytesDe(url) { const r = await fetch(url); if (!r.ok) throw new Error(url); return new Uint8Array(await r.arrayBuffer()); }

    const lh = 26, lw = lh * L.width / L.height; pag.drawImage(L, { x: M, y: y - lh, width: lw, height: lh });
    txt('show-bs.com', M + W - ancho('show-bs.com', N, 10), y - lh + 6, N, 10, rgb(.17, .17, .17));
    y -= lh + 14; pag.drawLine({ start: { x: M, y }, end: { x: M + W, y }, thickness: .8, color: linea });
    y -= 44; txt(titulo1, M, y, N, 22); if (titulo2) { y -= 26; txt(titulo2, M, y, N, 22); }
    y -= 18; txt(sub, M, y, R, 11, rgb(.17, .17, .17));

  let y = h1.y;

  y -= 16; txt('Total', M, y, N, 10); txt(String(d.datos.total), M + 440, y, N, 10);
  (d.datos.avisos || []).forEach(a => { y -= 14; txt('Aviso: ' + a, M, y, R, 8.5, rgb(.54, .38, 0)); });

  const f = d.firmas || {}, sinJefe = !d.con_jefe, col = (W - 24) / 3, top = y - 8;

  await caja(2, 'RR. HH.', f.rrhh, true);
  const pie = ['Firmada electrónicamente en convocatorias.show-bs.com. El informe de auditoría con la trazabilidad de cada firma está en la página siguiente.', 'ID de la solicitud: ' + (d.transaccion_id || d.id) + ' · ' + ESTADOS[d.estado] + '.'];
  let yp = 70; pie.forEach(p => partir(p, R, 7.5, W).forEach(l => { txt(l, M, yp, R, 7.5, gris); yp -= 9.5; }));
  // Página 2: el informe de auditoría (como el de los contratos).
  const h2 = hoja('INFORME DE AUDITORÍA', '', 'Solicitud de vacaciones · ' + d.nombre);
  let y2 = h2.y; const t2 = h2.txt, p2 = h2.pag;
  const fila2 = (k, v) => { const ls = partir(v, R, 9.5, W - 150); y2 -= 15; t2(k, M, y2, R, 9, gris); ls.forEach((l, i) => { if (i) y2 -= 12; t2(l, M + 150, y2, R, 9.5); }); };
  y2 -= 16; fila2('ID de la solicitud', d.transaccion_id || d.id); fila2('Huella del contenido', d.hash || '');
  fila2('Estado', ESTADOS[d.estado]); fila2('Método', 'La persona entra con un código enviado a su mail; el jefe directo y RR. HH. firman con links personales enviados a su mail.');
  y2 -= 26; t2('PASOS', M, y2, N, 10.5); y2 -= 7; p2.drawLine({ start: { x: M, y: y2 }, end: { x: M + W, y: y2 }, thickness: .5, color: suave });
  y2 -= 16; [['Fecha y hora', 0], ['Paso', 92], ['Detalle', 190]].forEach(([s, x]) => t2(s, M + x, y2, N, 8.5, gris));
  for (const e of d.eventos || []) {
    if (y2 < 90) break;
    const det = [e.quien, e.detalle].filter(Boolean).join(' · '), ext = [e.ip ? 'IP ' + e.ip : '', uaCorto(e.user_agent)].filter(Boolean).join(' · ');
    const ls = partir(det, R, 8.3, W - 190).concat(ext ? partir(ext, R, 7.6, W - 190).map(l => '\u0000' + l) : []);
